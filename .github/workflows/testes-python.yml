name: Testes Python

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  testes:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        suite:
          - Replay
          - Coletor
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Executar testes
        shell: bash
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          set -euo pipefail
          HOME="$(mktemp -d)"
          export HOME
          copia="$(mktemp -d)"
          git archive HEAD | tar -x -C "$copia"
          cd "$copia"
          case "$SUITE" in
            Replay)
              python -I testes/teste_replay.py "$copia"
              ;;
            Coletor)
              python -I testes/teste_tracker.py "$copia" testes/leitor-tcg-live.html
              ;;
            *)
              echo "Suite desconhecida: $SUITE" >&2
              exit 1
              ;;
          esac
