      Só vão as <b>suas</b> partidas; as que você recebeu de amigos ficam de fora.</p>
      ${ult ? `<label class="row" style="gap:6px"><input type="checkbox" id="am-novas" ${ex.novas ? 'checked' : ''}> Só as partidas novas desde o último envio (${ex.novas})</label>` : ''}
      <div class="row"><button class="primary" id="am-exportar">Exportar meus logs</button>
        <a class="btn" id="am-baixar" href="/exportar/meus-logs.zip">ou baixar pelo navegador</a></div>
      <p class="muted" style="font-size:.85rem">O arquivo é salvo em <span class="mono">${esc(r.downloads)}</span> e a pasta abre com ele selecionado: é só arrastar para a conversa. Pode mandar tudo de novo sempre que quiser: quem recebe ignora as partidas repetidas.</p>
      <div id="am-feito"></div>
    </section>
    <section class="panel"><h2>2. Receber logs de um amigo (manual)</h2>
      <p>Escolha o .zip que ele mandou (pode escolher vários de uma vez). Também aceita os .txt da pasta <span class="mono">dados\\logs</span> do programa dele.</p>
      <div class="row"><input type="file" id="am-arquivos" accept=".zip,.txt" multiple>
        <input id="am-nome" placeholder="Nick dele (só se o arquivo não for do botão Exportar)" style="width:320px">
        <button class="primary" id="am-importar">Importar</button></div>
      <div id="am-resultado"></div>
    </section>
    <section class="panel"><h2>Jogadores importados</h2>
      ${r.amigos.length ? `<div class="tabela"><table><thead><tr><th>Jogador</th><th class="n">Partidas</th><th>Primeira</th><th>Última</th><th></th></tr></thead><tbody>
        ${r.amigos.map(a => `<tr><td><b>${esc(a.nome)}</b></td><td class="n">${a.partidas}</td><td>${fmtData(a.primeira)}</td><td>${fmtData(a.ultima)}</td>
          <td style="text-align:right;white-space:nowrap"><button data-ver="${esc(a.nome)}">Ver partidas</button> <button class="perigo" data-apagar="${esc(a.nome)}">Apagar</button></td></tr>`).join('')}
        </tbody></table></div>` : '<p class="muted">Nenhum amigo importado ainda.</p>'}
    </section>`;
  $('#pa-escolher').onclick = async () => {
    toast('Abrindo a janela para escolher a pasta (pode aparecer atrás do navegador)…');
    const x = await api('/api/amigos/pasta/escolher', { method: 'POST' }).catch(e => ({ erro: e.message }));
    if (x.pasta) $('#pa-caminho').value = x.pasta;
    else if (x.erro) toast('Não consegui abrir a janela: cole o caminho da pasta no campo.');
  };
  $('#pa-salvar').onclick = async () => {
    const caminho = $('#pa-caminho').value.trim();
    if ($('#pa-auto').checked && !caminho) { toast('Escolha a pasta primeiro'); return; }
    await api('/api/config', { method: 'POST', body: JSON.stringify({ pasta_compartilhada: caminho, pasta_auto: $('#pa-auto').checked, pasta_minutos: Number($('#pa-minutos').value) }) });
    toast($('#pa-auto').checked ? 'Salvo. Vou sincronizar agora e depois de tempos em tempos.' : 'Salvo');
    setTimeout(renderAmigos, 2500);
  };
  $('#pa-agora').onclick = async () => {
    $('#pa-agora').disabled = true; $('#pa-estado').innerHTML = '<p class="muted">Sincronizando…</p>';
    try { await api('/api/amigos/pasta/sincronizar', { method: 'POST' }); } catch (e) { toast(e.message); }
    await carregarJogadores(); renderAmigos();
  };
  const novas = () => $('#am-novas') && $('#am-novas').checked;
  const linkBaixar = () => { $('#am-baixar').href = '/exportar/meus-logs.zip' + (novas() ? '?so_novas=1' : ''); };
  if ($('#am-novas')) $('#am-novas').onchange = linkBaixar; linkBaixar();
  $('#am-baixar').onclick = () => setTimeout(renderAmigos, 1500);
  $('#am-exportar').onclick = async () => {
    try { const x = await api('/api/amigos/exportar', { method: 'POST', body: JSON.stringify({ so_novas: novas() }) });
      await renderAmigos();
      $('#am-feito').innerHTML = `<div class="aviso">Pronto: ${x.partidas} partida(s) em <span class="mono">${esc(x.arquivo)}</span>. Mande esse arquivo para o seu amigo.</div>`; }
    catch (e) { $('#am-feito').innerHTML = `<div class="aviso erro">${esc(e.message)}</div>`; }
  };
  $('#am-importar').onclick = async () => {
    const inp = $('#am-arquivos');
    if (!inp.files.length) { toast('Escolha o arquivo que o seu amigo mandou'); return; }
    const fd = new FormData(); [...inp.files].forEach(f => fd.append('arquivos', f)); fd.append('nome', $('#am-nome').value.trim());
    $('#am-importar').disabled = true; $('#am-resultado').innerHTML = '<p class="muted">Lendo os logs…</p>';
    const resp = await fetch('/api/amigos/importar', { method: 'POST', body: fd }).catch(() => null);
    const j = resp ? await resp.json().catch(() => ({})) : { erro: AJUDA_CONEXAO };
    $('#am-importar').disabled = false;
    if (!resp || !resp.ok) { $('#am-resultado').innerHTML = `<div class="aviso erro">${esc(j.erro || 'Não consegui importar.')}</div>`; return; }
    await carregarJogadores(); await renderAmigos();
    $('#am-resultado').innerHTML = `<div class="aviso">Logs de <b>${esc(j.nome)}</b>: ${j.novas} partida(s) nova(s)${j.repetidas ? `, ${j.repetidas} já estavam aqui` : ''}${j.invalidos ? `, ${j.invalidos} arquivo(s) não eram log` : ''}. <a href="#partidas" id="am-ver-novo">Ver partidas dele</a></div>`;
    $('#am-ver-novo').onclick = () => { S.jogador = j.nome; try { localStorage.setItem('jogador', j.nome); } catch (e) {} };
  };
  document.querySelectorAll('[data-ver]').forEach(b => b.onclick = () => { S.jogador = b.dataset.ver; try { localStorage.setItem('jogador', S.jogador); } catch (e) {} location.hash = 'partidas'; });
  document.querySelectorAll('[data-apagar]').forEach(b => b.onclick = async () => {
    if (b.dataset.confirmar !== '1') { b.dataset.confirmar = '1'; b.textContent = 'Confirmar: apagar todas as partidas dele'; return; }
    const x = await api('/api/amigos/' + encodeURIComponent(b.dataset.apagar), { method: 'DELETE' });
    if (S.jogador === b.dataset.apagar) S.jogador = '';
    toast(`${x.apagadas} partida(s) apagada(s)`); await carregarJogadores(); renderAmigos();
  });
}

// Conferência da lista com as regras do Standard (60 cartas, 4 cópias, ACE SPEC, Básico, marcas)
function conferenciaStandard(v, compacta) {
  if (!v) return '';
  const ok = !v.problemas.length;
  return `<div class="aviso lo-validacao ${ok ? 'ok' : 'erro'}">
    <b>${ok ? `✓ Lista válida no Standard: ${v.total} cartas, marcas ${v.marcas.join(', ')}.` : `A lista não vale no Standard (${v.problemas.length} problema${v.problemas.length === 1 ? '' : 's'}):`}</b>
    ${v.problemas.length ? `<ul>${v.problemas.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
    ${v.avisos.length ? `${compacta ? '' : `<p style="margin-top:6px">Para conferir:</p>`}<ul class="muted">${v.avisos.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
  </div>`;
}

    <div id="area-form"></div>
    <div class="kpis">
      <div class="kpi"><span class="label">Partidas</span><span class="v">${t.n}</span><span class="d">${t.v} vitórias</span></div>
      <div class="kpi"><span class="label">Taxa de vitória</span><span class="v">${pct(t.taxa)}</span><span class="d">${t.ic_baixo != null ? `provável entre ${fmt(t.ic_baixo, 0)}% e ${fmt(t.ic_alto, 0)}%` : '–'}</span></div>
      <div class="kpi"><span class="label">Começando</span><span class="v">${pct(ordem['Começando']?.taxa)}</span><span class="d">${ordem['Começando']?.n ?? 0} partidas</span></div>
      <div class="kpi"><span class="label">Indo em segundo</span><span class="v">${pct(ordem['Indo em segundo']?.taxa)}</span><span class="d">${ordem['Indo em segundo']?.n ?? 0} partidas</span></div>
    </div>
    <section class="panel"><h2>Contra cada deck</h2>${tabelaGrupos(a.por_adversario, 'Deck do adversário', true, deckHtml)}</section>

// Meus decks > deck: probabilidades exatas da lista (tracker/probabilidades.py).
async function desenharConsistencia(id) {
  const el = $('#consistencia'); if (!el) return;
  let r; try { r = await api(`/api/decks/${id}/consistencia`); } catch (e) { el.innerHTML = `<h2>Consistência</h2><p class="aviso erro">${esc(e.message)}</p>`; return; }
  const p = x => fmt(100 * x, 1) + '%';
  const ob = r.observado;
  const esperadoComMull = r.mulligan;  // chance de pelo menos 1 mulligan na partida = chance da 1ª mão sem Básico
  const ordenadas = [...r.cartas].sort((a, b) => b.qtd - a.qtd || a.nome.localeCompare(b.nome));
  el.innerHTML = `<h2>Consistência</h2>
    <p class="sub">Contas exatas com as regras do Standard: mão de 7, mulligan sem Pokémon Básico, 6 prêmios e 1 compra por turno (quem começa também compra). Valem igual começando ou indo em segundo.</p>
    ${r.deck !== 60 ? `<p class="aviso">A lista tem ${r.deck} cartas; as contas usam esse total.</p>` : ''}
    ${r.sem_estagio ? `<p class="aviso">${r.sem_estagio} Pokémon sem o estágio na biblioteca de cartas: o mulligan pode estar errado. Atualize a biblioteca em Programa &gt; Biblioteca de cartas.</p>` : ''}
    <div class="kpis">
      <div class="kpi"><span class="label">Pokémon Básicos</span><span class="v">${r.basicos}</span><span class="d">na lista de ${r.deck}</span></div>
      <div class="kpi"><span class="label">Chance de mulligan</span><span class="v">${p(r.mulligan)}</span><span class="d">${fmt(r.mulligans_esperados, 2)} mulligans por partida, em média</span></div>
      <div class="kpi"><span class="label">Suas partidas com mulligan</span><span class="v">${ob.partidas ? p(ob.com_mulligan / ob.partidas) : '–'}</span><span class="d">${ob.partidas ? `${ob.com_mulligan} de ${ob.partidas} (esperado ${p(esperadoComMull)})` : 'nenhuma partida ligada ainda'}</span></div>
    </div>
    <div class="tabela alta"><table><thead><tr><th>Carta</th><th class="n">Cópias</th><th class="n">Na mão inicial</th><th class="n">Até o 1º turno</th><th class="n">Até o 2º</th><th class="n">Até o 3º</th><th class="n">Alguma nos prêmios</th><th class="n">Todas nos prêmios</th></tr></thead><tbody>
      ${ordenadas.map(c => `<tr><td>${esc(c.nome)}${c.basico ? ' <span class="pill n">Básico</span>' : ''}</td><td class="n">${c.qtd}</td>
        <td class="n">${p(c.na_mao)}</td>${c.ate_turno.map(x => `<td class="n">${p(x)}</td>`).join('')}
        <td class="n">${p(c.alguma_premio)}</td><td class="n" style="${c.todas_premio >= 0.05 ? 'color:var(--bad);font-weight:600' : ''}">${p(c.todas_premio)}</td></tr>`).join('')}
    </tbody></table></div>
    <h3>Duas cartas juntas</h3>
    <div class="row"><select id="cb-a">${ordenadas.map(c => `<option>${esc(c.nome)}</option>`).join('')}</select>
      <span>e</span><select id="cb-b">${ordenadas.map((c, i) => `<option ${i === 1 ? 'selected' : ''}>${esc(c.nome)}</option>`).join('')}</select>
      <span id="cb-res" class="muted"></span></div>`;
  const combo = async () => {
    const a = $('#cb-a').value, b = $('#cb-b').value;
    if (a === b) { $('#cb-res').textContent = 'Escolha duas cartas diferentes.'; return; }
    try { const c = await api(`/api/decks/${id}/combo?a=${encodeURIComponent(a)}&b=${encodeURIComponent(b)}`);
      $('#cb-res').innerHTML = `Na mão inicial: <b>${p(c.turnos[0])}</b> · até o 1º turno: <b>${p(c.turnos[1])}</b> · 2º: <b>${p(c.turnos[2])}</b> · 3º: <b>${p(c.turnos[3])}</b>`; }
    catch (e) { $('#cb-res').textContent = e.message; }
  };
  $('#cb-a').onchange = combo; $('#cb-b').onchange = combo;
  if (ordenadas.length > 1) combo();
}

/* =====================================================================

const MIN_LINHAS = { pokemon: 12, trainer: 20, energy: 7 };
const SEC_LO = [['pokemon', 'Pokémon'], ['trainer', 'Trainer'], ['energy', 'Energy']];
function papelSalvo() { try { return localStorage.getItem('papel') || 'a4'; } catch (e) { return 'a4'; } }
async function renderListaOficial(id) {
  const r = await api('/api/decks/' + id + '/lista-oficial');

}
function divisaoAuto(L) {
  const ano = (L.jogador.nascimento || '').split('-')[0], dv = L.r.divisoes;
  if (!/^\d{4}$/.test(ano)) return '';
  return Number(ano) >= dv.junior ? 'junior' : Number(ano) >= dv.senior[0] ? 'senior' : 'masters';
}
function divisoesHtml(L) {
  const dv = L.r.divisoes, marcada = L.divisao || divisaoAuto(L);
  const anos = []; for (let a = dv.senior[0]; a <= dv.senior[1]; a++) anos.push(a);
  const op = [['junior', `Junior Division (born in ${dv.junior} or later)`], ['senior', `Senior Division (born in ${anos.slice(0, -1).join(', ')}, or ${anos[anos.length - 1]})`],
              ['masters', `Masters Division (born in ${dv.masters} or earlier)`]];
  return `<span><b>Age Division</b> (check one):</span>${op.map(([k, t]) => `<button type="button" data-div="${k}"><span class="caixa ${marcada === k ? 'x' : ''}"></span>${t}</button>`).join('')}`;
}
function desenharListaOficial() {
  const L = S.lo, r = L.r;
  const [ano, mes, dia] = (L.jogador.nascimento || '').split('-');
  const linhasSec = k => { const ls = L.linhas[k] || (L.linhas[k] = []); const extra = Math.max(0, MIN_LINHAS[k] - ls.length);
    return [...ls.map((c, i) => [c, i]), ...Array.from({ length: extra }, (_, j) => [null, ls.length + j])]; };
  const nLinhas = SEC_LO.reduce((a, [k]) => a + Math.max(MIN_LINHAS[k], (L.linhas[k] || []).length), 0);

      <thead><tr><th class="sec" colspan="${k === 'pokemon' ? 5 : 2}">${rot}<small data-soma="${k}"></small></th><th style="background:none;border:none"></th></tr>
      <tr><th>QTY</th><th style="text-align:left">NAME</th>${k === 'pokemon' ? '<th>SET</th><th>COLL. #</th><th>REG</th>' : ''}<th style="background:none;border:none"></th></tr></thead>
      <tbody>${linhasSec(k).map(([c, i]) => linha(k, c, i)).join('')}</tbody></table>

      <span class="muted lo-salvo" id="lo-salvo">${L.salvo ? `Edições salvas ${fmtData(L.salvo, true)}` : 'Gerada a partir do deck'}</span>

      <button class="primary" id="lo-pdf">Salvar em PDF</button></div></div>

    ${r.deck_mudou ? '<div class="aviso no-print">A lista do deck mudou depois que você editou esta lista oficial. Use "Refazer a partir do deck" se quiser trazer as cartas novas.</div>' : ''}

      <div class="topo">
        <div><h2>Pokémon TCG Deck List</h2><div class="temporada">${dv.temporada_inicio}–${dv.temporada_inicio + 1} Tournament Season${r.ultima_colecao ? ` · through ${esc(r.ultima_colecao)}` : ''}</div></div>
        <div class="formato"><b>Format</b> (check one):<span class="caixa x"></span>Standard<span class="caixa"></span>Expanded</div>

      </div>
      <div class="divisoes" id="lo-div">${divisoesHtml(L)}</div>
      <div class="corpo">
        <div class="legenda-sets">
          <div><h4>Standard Format Regulation Marks</h4><div class="marcas-std">${r.validacao.marcas.map(m => `<span>${esc(m)}</span>`).join('')}</div></div>

        </div>
        <div class="secoes">${SEC_LO.map(([k, rot]) => tabela(k, rot)).join('')}</div>

      <div class="rodape"><span>List the set abbreviation, collector number and regulation mark of every Pokémon; Trainer and Energy cards need only quantity and name. For a Pokémon from an older set that was reprinted in a listed set, write NA as the set. The list must match the deck exactly.</span>
        <b>TOTAL CARDS: <span data-soma="total"></span></b></div>
    </div></div>`;

function atualizarSomasLO() {
  const L = S.lo; if (!L) return;
  const soma = k => (L.linhas[k] || []).reduce((a, c) => a + (c && c.nome && c.nome.trim() ? Number(c.qtd) || 0 : 0), 0);
  let total = 0;
  SEC_LO.forEach(([k]) => { const v = soma(k); total += v; const el = document.querySelector(`[data-soma="${k}"]`); if (el) el.textContent = v ? `${v} carta${v === 1 ? '' : 's'}` : ''; });
  const t = document.querySelector('[data-soma="total"]'); if (t) { t.textContent = total; t.style.color = total === 60 ? '' : '#c0392b'; }
}
function ligarListaOficial() {
  const L = S.lo, r = L.r;
  let tSalvar, tValidar;
  const salvar = async () => {
    clearTimeout(tSalvar);
    $('#lo-salvo') && ($('#lo-salvo').textContent = 'Salvando…');
    try {
      const x = await api('/api/decks/' + L.id + '/lista-oficial', { method: 'PUT', body: JSON.stringify({ linhas: L.linhas, jogador: L.jogador }) });
      L.salvo = x.salvo_em; L.r.editada = true;
      if (S.lo === L && $('#lo-salvo')) $('#lo-salvo').textContent = `Edições salvas ${fmtData(x.salvo_em, true).replace(/<[^>]+>/g, '')}`;
    } catch (e) { if ($('#lo-salvo')) $('#lo-salvo').textContent = 'Não consegui salvar: ' + e.message; }
  };
  const validar = async () => {
    try { const v = await api('/api/lista-oficial/validar', { method: 'POST', body: JSON.stringify({ linhas: L.linhas }) });

  document.querySelectorAll('.folha [data-campo]').forEach(inp => inp.oninput = () => {
    const k = inp.dataset.sec, i = Number(inp.dataset.i), ls = L.linhas[k];

    ls[i][inp.dataset.campo] = inp.dataset.campo === 'qtd' ? inp.value.replace(/\D/g, '').slice(0, 2) : inp.value;
    if (inp.dataset.campo === 'qtd' && inp.value !== ls[i].qtd) inp.value = ls[i].qtd;
    mudou();
  });
  document.querySelectorAll('.folha [data-jog]').forEach(inp => inp.oninput = () => {
    const campo = inp.dataset.jog;
    if (['nome', 'id'].includes(campo)) L.jogador[campo] = inp.value;
    else {
      inp.value = inp.value.replace(/\D/g, '');
      const v = Object.fromEntries(['ano', 'mes', 'dia'].map(c => [c, document.querySelector(`.folha [data-jog="${c}"]`).value]));
      L.jogador.nascimento = [v.ano, v.mes, v.dia].join('-').replace(/^-+$/, '');
      $('#lo-div').innerHTML = divisoesHtml(L); ligarDivisoes();
    }
    clearTimeout(tSalvar); tSalvar = setTimeout(salvar, 900);
  });
  const ligarDivisoes = () => document.querySelectorAll('[data-div]').forEach(b => b.onclick = () => {
    L.divisao = (L.divisao || divisaoAuto(L)) === b.dataset.div && L.divisao ? '' : b.dataset.div; $('#lo-div').innerHTML = divisoesHtml(L); ligarDivisoes(); });
  ligarDivisoes();
  document.querySelectorAll('[data-tirar]').forEach(b => b.onclick = () => {
    const [k, i] = b.dataset.tirar.split(':'); const ls = L.linhas[k];
    if (Number(i) < ls.length) ls.splice(Number(i), 1);
    desenharListaOficial(); mudou();
  });
  document.querySelectorAll('[data-mais]').forEach(b => b.onclick = () => {
    const k = b.dataset.mais, ls = L.linhas[k];
    const alvo = Math.max(ls.length, MIN_LINHAS[k]) + 1;
    while (ls.length < alvo) ls.push(k === 'pokemon' ? { qtd: '', nome: '', set: '', numero: '', reg: '' } : { qtd: '', nome: '' });
    desenharListaOficial();
    const ins = document.querySelectorAll(`.folha [data-sec="${k}"][data-campo="qtd"]`); ins[ins.length - 1]?.focus();
  });
  $('#lo-papel').onchange = e => { L.papel = e.target.value; try { localStorage.setItem('papel', L.papel); } catch (er) {} $('#folha').classList.toggle('carta', L.papel === 'carta'); };
  if ($('#lo-refazer')) $('#lo-refazer').onclick = async () => {
    if (!confirm('Descartar as suas edições e gerar a lista oficial de novo a partir do deck? Nome, Player ID e data de nascimento continuam.')) return;
    await api('/api/decks/' + L.id + '/lista-oficial', { method: 'DELETE' }); toast('Lista refeita a partir do deck'); renderListaOficial(L.id);
  };
  $('#lo-pdf').onclick = async () => {
    if (tSalvar) await salvar();
    let st = document.getElementById('estilo-pagina');
    if (!st) { st = document.createElement('style'); st.id = 'estilo-pagina'; document.head.appendChild(st); }
    st.textContent = `@page { size: ${L.papel === 'carta' ? 'letter' : 'A4'} portrait; margin: 8mm; }`;
    const titulo = document.title;

    window.addEventListener('afterprint', fim);
    window.print();
  };
}

/* =====================================================================
   REGRAS DO STANDARD: a base de regras (markdown) com índice e busca
   ===================================================================== */
const semAcento = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
function mdInline(s) {
  return esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, (m, txt, url) => `<a href="${url}" target="_blank" rel="noopener">${txt}</a>`);
}
function mdTabela(linhas) {
  const cel = r => r.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim());
  const temSep = linhas[1] && /^\s*\|?\s*:?-{2,}/.test(linhas[1]);
  const cab = cel(linhas[0]), corpo = linhas.slice(temSep ? 2 : 1).map(cel);
  return `<div class="tabela"><table><thead><tr>${cab.map(c => `<th>${mdInline(c)}</th>`).join('')}</tr></thead>
    <tbody>${corpo.map(r => `<tr>${r.map(c => `<td>${mdInline(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function mdLista(linhas) {
  let h = ''; const pilha = [];
  for (const l of linhas) {
    const m = l.match(/^(\s*)([-*]|\d+\.)\s+(.*)$/);
    if (!m) { h += ' ' + mdInline(l.trim()); continue; }
    const ind = m[1].length, tag = /\d/.test(m[2]) ? 'ol' : 'ul';
    while (pilha.length && ind < pilha[pilha.length - 1].ind) h += `</li></${pilha.pop().tag}>`;
    if (!pilha.length || ind > pilha[pilha.length - 1].ind) { h += `<${tag}>`; pilha.push({ ind, tag }); } else h += '</li>';
    h += `<li>${mdInline(m[3])}`;
  }
  while (pilha.length) h += `</li></${pilha.pop().tag}>`;
  return h;
}
// Markdown simples (títulos, parágrafos, listas, tabelas, negrito e links), em seções para a busca.
function mdHtml(md) {
  const L = String(md || '').replace(/\r/g, '').split('\n'), out = [], indice = [];
  const ehLista = l => /^\s*([-*]|\d+\.)\s+/.test(l);
  let i = 0, aberta = false, n = 0;
  while (i < L.length) {
    const l = L[i];
    if (!l.trim()) { i++; continue; }
    const t = l.match(/^(#{1,4})\s+(.*)$/);
    if (t) {
      const nivel = t[1].length, id = 'rg-' + (++n);
      if (nivel <= 3) { if (aberta) out.push('</section>'); out.push(`<section class="rg-sec" data-nivel="${nivel}">`); aberta = true; }
      if (nivel >= 2) indice.push({ nivel, texto: t[2], id });
      out.push(`<h${nivel} id="${id}">${mdInline(t[2])}</h${nivel}>`); i++; continue;
    }
    if (l.trim().startsWith('|')) { const rs = []; while (i < L.length && L[i].trim().startsWith('|')) rs.push(L[i++]); out.push(mdTabela(rs)); continue; }
    if (ehLista(l)) { const it = []; while (i < L.length && (ehLista(L[i]) || (/^\s{2,}\S/.test(L[i])))) it.push(L[i++]); out.push(mdLista(it)); continue; }
    const par = [];
    while (i < L.length && L[i].trim() && !/^#{1,4}\s/.test(L[i]) && !L[i].trim().startsWith('|') && !ehLista(L[i])) par.push(L[i++].trim());
    out.push(`<p>${mdInline(par.join(' '))}</p>`);
  }
  if (aberta) out.push('</section>');
  return { html: out.join('\n'), indice };
}
// destaca as ocorrências (sem diferenciar acentos e maiúsculas) dentro de um elemento
function destacar(el, termo) {
  const alvo = semAcento(termo); if (!alvo) return 0;
  let total = 0;
  const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, { acceptNode: n => n.parentElement.closest('mark,script,style') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT });
  const nos = []; while (w.nextNode()) nos.push(w.currentNode);
  for (const no of nos) {
    const txt = no.nodeValue; let norm = '', mapa = [];
    for (let k = 0; k < txt.length; k++) { const c = semAcento(txt[k]); for (let q = 0; q < c.length; q++) { norm += c[q]; mapa.push(k); } }
    let pos = norm.indexOf(alvo); if (pos < 0) continue;
    const frag = document.createDocumentFragment(); let ult = 0;
    while (pos >= 0) {
      const ini = mapa[pos], fim = mapa[pos + alvo.length - 1] + 1;
      frag.append(txt.slice(ult, ini)); const mk = document.createElement('mark'); mk.textContent = txt.slice(ini, fim); frag.append(mk);
      ult = fim; total++; pos = norm.indexOf(alvo, pos + alvo.length);
    }
    frag.append(txt.slice(ult)); no.replaceWith(frag);
  }
  return total;
}
async function renderRegrasStandard() {

  main.innerHTML = `
    ${trilha()}<header><h1>Regras do Standard</h1><p class="sub">Resumo em português das regras oficiais da Play! Pokémon, só do formato Standard (o único que o programa analisa). Atualizada em <b>${data}</b>${r.fonte === 'baixada' ? ' (baixada do GitHub)' : ''}. A base é revisada todo mês e chega aqui sozinha, sem precisar atualizar o programa.</p></header>
    <section class="panel"><h2>O que o programa usa destas regras</h2>

        <div><b>${g.tamanho_deck} cartas · até ${g.max_copias} · ${g.max_ace_spec} ACE SPEC</b>Conferência de cada lista em Meus decks e na Lista oficial (versões diferentes com o mesmo nome somam).</div>
        <div><b>${g.premios} prêmios</b>Quem pega o último vence: o leitor usa isso quando o log não traz a linha final. ex vale 2 e Mega ex vale 3.</div>
        <div><b>1º turno</b>Quem começa não ataca nem joga Apoiador, e ninguém evolui no próprio 1º turno. Por isso as Decisões separam as aberturas por quem começou, e o replay não evolui um Pokémon que acabou de entrar.</div>
      </div>
      <div class="row"><input id="rg-busca" placeholder="Buscar nas regras (ex.: mulligan, empate, Apoiador)" style="flex:1;min-width:240px"><span class="muted" id="rg-cont"></span>
        <button id="rg-atualizar">Procurar atualização</button><a class="btn" href="${esc(r.pagina_oficial)}" target="_blank" rel="noopener">Documentos oficiais ↗</a></div>
      ${est.erro ? `<div class="aviso erro">${esc(est.erro)}</div>` : est.mensagem ? `<p class="muted" style="font-size:.85rem">${esc(est.mensagem)}</p>` : ''}
      ${est.verificado_em ? `<p class="muted" style="font-size:.8rem">Última verificação no GitHub: ${fmtData(est.verificado_em, true)}</p>` : ''}
    </section>
    <div class="rg-layout">
      <aside class="panel rg-indice" aria-label="Índice das regras">${indice.map(x => `<button class="n${x.nivel}" data-alvo="${x.id}">${esc(x.texto)}</button>`).join('')}</aside>
      <article class="panel rg-doc" id="rg-doc">${html}</article>
    </div>`;
  document.querySelectorAll('[data-alvo]').forEach(b => b.onclick = () => document.getElementById(b.dataset.alvo)?.scrollIntoView({ behavior: 'smooth', block: 'start' }));
  const doc = $('#rg-doc'), original = doc.innerHTML;
  let t;
  $('#rg-busca').oninput = e => { clearTimeout(t); t = setTimeout(() => {
    const q = e.target.value.trim();
    doc.innerHTML = original;
    if (q.length < 2) { $('#rg-cont').textContent = ''; return; }
    let achados = 0, secoes = 0;
    doc.querySelectorAll('.rg-sec').forEach(sec => { const n = destacar(sec, q); sec.hidden = !n; achados += n; secoes += n ? 1 : 0; });
    $('#rg-cont').textContent = achados ? `${achados} ocorrência${achados === 1 ? '' : 's'} em ${secoes} trecho${secoes === 1 ? '' : 's'}` : 'Nada encontrado';
    doc.querySelector('mark')?.scrollIntoView({ block: 'center' });
  }, 200); };
  $('#rg-atualizar').onclick = async () => {
    $('#rg-atualizar').disabled = true;
    const x = await api('/api/regras-standard/atualizar', { method: 'POST' }).catch(e => ({ estado: { erro: e.message } }));
    toast(x.estado?.erro || x.estado?.mensagem || 'Verificado'); renderRegrasStandard();
  };
}

      ${x.passos?.length ? `<p class="label" style="margin-top:8px">O que fazer agora</p><ol style="margin:4px 0;padding-left:20px">${x.passos.map(m => `<li>${esc(m)}</li>`).join('')}</ol>` : ''}</section>`).join('')}
    <div class="row" style="margin-top:14px"><span class="grow"></span><button class="primary" id="nv-ok">Entendi</button></div></div>`;

/* ---------------- primeiro uso guiado ---------------- */
async function copiarTexto(texto) {
  try { await navigator.clipboard.writeText(texto); return true; } catch (e) {}
  const ta = Object.assign(document.createElement('textarea'), { value: texto });
  ta.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(ta); ta.select();
  const ok = document.execCommand('copy'); ta.remove(); return ok;
}
async function mostrarGuia() {
  const st = await api('/api/status'), cfg = st.config;
  let atalhos = null;
  if (st.windows) { try { atalhos = await api('/api/atalhos'); } catch (e) {} }
  let passo = 0, nick = cfg.nick || '';
  const fundo = document.createElement('div');
  fundo.className = 'janela-fundo';
  document.body.appendChild(fundo);
  const passos = [
    () => `<h2 style="margin-top:0">Quem é você no TCG Live?</h2>
      <p>Digite seu nick <b>exatamente como aparece no jogo</b>. É assim que o programa separa suas vitórias e derrotas.</p>
      <div class="row"><input id="g-nick" value="${esc(nick)}" placeholder="Seu nick no TCG Live" style="flex:1"></div>
      <p class="muted" style="font-size:.85rem">Pode deixar em branco: o programa descobre sozinho na primeira partida, porque o log mostra o nome das cartas que <i>você</i> comprou.</p>`,
    () => `<h2 style="margin-top:0">No jogo</h2>
      <ol><li>Deixe o Pokémon TCG Live em <b>inglês</b>: Settings &gt; Language &gt; English. Em português o log não é lido.</li>
        <li>No fim de cada partida, clique em <b>Battle Log</b> e no botão de <b>exportar</b> (canto superior direito). O Coletor pega o log sozinho.</li>
        <li>Quer que o programa clique por você? Depois, veja o <b>Modo automático</b> em Programa &gt; Ajustes e captura.</li></ol>
      ${atalhos && !atalhos.area ? `<div class="row" style="margin-top:8px"><button id="g-atalho">Criar o atalho na Área de Trabalho</button><span class="muted" id="g-atalho-ok"></span></div>` : ''}`,
    () => `<h2 style="margin-top:0">Teste a captura</h2>
      <p>Clique no botão: ele copia um log de exemplo, como o jogo faz. Se o Coletor perceber, está tudo pronto.</p>
      <div class="row"><button class="primary" id="g-testar">Copiar um log de exemplo</button><span id="g-teste"></span></div>
      <p class="muted" style="font-size:.85rem">O log de exemplo não entra nas suas partidas.</p>`,
  ];
  const desenhar = () => {
    fundo.innerHTML = `<div class="janela guia" role="dialog" aria-label="Primeiro uso" style="width:min(560px,100%)">
      <div class="guia-passos">${passos.map((_, i) => `<span class="${i <= passo ? 'feito' : ''}"></span>`).join('')}</div>
      <p class="label" style="margin:0 0 4px">Passo ${passo + 1} de ${passos.length}</p>
      ${passos[passo]()}
      <div class="row" style="margin-top:16px"><button id="g-pular" style="border:none;background:none;color:var(--muted)">Pular</button><span class="grow"></span>
        ${passo ? '<button id="g-voltar">Voltar</button>' : ''}
        <button class="primary" id="g-seguir">${passo === passos.length - 1 ? 'Concluir' : 'Próximo'}</button></div></div>`;
    const guardarNick = () => { if ($('#g-nick')) nick = $('#g-nick').value.trim(); };
    const terminar = async () => {
      await api('/api/config', { method: 'POST', body: JSON.stringify({ guia_visto: true, ...(nick ? { nick } : {}) }) }).catch(() => {});
      fundo.remove();
    };
    $('#g-seguir').onclick = async () => {
      guardarNick();
      if (passo < passos.length - 1) { passo++; desenhar(); return; }
      await terminar(); toast('Tudo pronto. Boas partidas!'); render();
    };
    if ($('#g-voltar')) $('#g-voltar').onclick = () => { guardarNick(); passo--; desenhar(); };
    $('#g-pular').onclick = () => { guardarNick(); terminar(); };
    if ($('#g-atalho')) $('#g-atalho').onclick = async () => {
      try { atalhos = await api('/api/atalhos', { method: 'POST', body: JSON.stringify({ area: true }) }); $('#g-atalho').remove(); $('#g-atalho-ok').innerHTML = '<span class="ok">✓ Atalho criado</span>'; }
      catch (e) { toast(e.message); }
    };
    if ($('#g-testar')) $('#g-testar').onclick = async () => {
      const saida = $('#g-teste');
      saida.textContent = 'Copiando…';
      const antes = (await api('/api/status')).coletor.teste_em;
      const texto = await fetch('/api/exemplo-log').then(r => r.text());
      if (!await copiarTexto(texto)) { saida.innerHTML = '<span style="color:var(--bad)">Não consegui copiar. Tente de novo.</span>'; return; }
      saida.textContent = 'Esperando o Coletor perceber…';
      for (let i = 0; i < 12; i++) {
        await new Promise(r => setTimeout(r, 700));
        const s2 = await api('/api/status').catch(() => null);
        if (s2 && s2.coletor.teste_em > antes) { saida.innerHTML = '<span class="ok">✓ A captura está funcionando.</span>'; return; }
      }
      saida.innerHTML = `<span style="color:var(--bad)">O Coletor não percebeu a cópia.</span> ${st.coletor.ativo ? 'Feche e abra o programa e tente de novo.' : 'A captura está desligada: ligue no Início ou em Ajustes.'}`;
    };
    ($('#g-nick') || $('#g-seguir')).focus();
  };
  desenhar();
}

/* ---------------- busca rápida (Ctrl+K) ---------------- */
const TELAS_BUSCA = [['painel', 'Início'], ['partidas', 'Partidas'], ['desempenho', 'Desempenho'], ['decisoes', 'Decisões'],
  ['decks', 'Meus decks'], ['meta', 'Meta'], ['matchups', 'Matchups'], ['deck', 'Perfil de deck'], ['cartas', 'Uso de cartas'],
  ['cartas-mu', 'Cartas x matchups'], ['torneios', 'Torneios'], ['regras-standard', 'Regras do Standard'],
  ['ajustes', 'Ajustes e captura'], ['amigos', 'Amigos (trocar logs)'], ['biblioteca', 'Biblioteca de cartas'],
  ['revisao', 'Linhas não lidas'], ['regras', 'Regras de leitura']];
async function abrirBusca() {
  if ($('#busca-fundo')) return;
  const fundo = document.createElement('div');
  fundo.className = 'janela-fundo'; fundo.id = 'busca-fundo';
  fundo.innerHTML = `<div class="janela busca" role="dialog" aria-label="Buscar">
    <input id="busca-q" placeholder="Buscar telas, seus decks, decks do meta, adversários…" autocomplete="off">
    <ul id="busca-lista" role="listbox"></ul></div>`;
  document.body.appendChild(fundo);
  const q = $('#busca-q'); q.focus();
  const fechar = () => fundo.remove();
  fundo.onclick = e => { if (e.target === fundo) fechar(); };
  let itens = TELAS_BUSCA.map(([h, n]) => ({ tipo: 'Tela', nome: n, ir: () => { location.hash = h; } }));
  let achados = [], sel = 0;
  const escolher = k => { const i = achados[k]; if (!i) return; fechar(); i.ir(); };
  const desenhar = () => {
    const termos = semAcento(q.value).split(/\s+/).filter(Boolean);
    achados = itens.filter(i => termos.every(t => semAcento(i.nome + ' ' + (i.extra || '') + ' ' + i.tipo).includes(t))).slice(0, 14);
    sel = Math.min(sel, Math.max(achados.length - 1, 0));
    $('#busca-lista').innerHTML = achados.length ? achados.map((i, k) => `<li role="option" data-k="${k}" aria-selected="${k === sel}">
      <span class="b-tipo">${esc(i.tipo)}</span>${i.ico || ''}<span>${esc(i.nome)}</span>${i.extra ? `<span class="extra">${esc(i.extra)}</span>` : ''}</li>`).join('')
      : '<li class="muted">Nada encontrado</li>';
    document.querySelectorAll('#busca-lista li[data-k]').forEach(li => li.onclick = () => escolher(Number(li.dataset.k)));
  };
  q.oninput = () => { sel = 0; desenhar(); };
  q.onkeydown = e => {
    if (e.key === 'ArrowDown') { sel = Math.min(sel + 1, achados.length - 1); desenhar(); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { sel = Math.max(sel - 1, 0); desenhar(); e.preventDefault(); }
    else if (e.key === 'Enter') escolher(sel);
    else if (e.key === 'Escape') fechar();
  };
  desenhar();
  const [meus, ps] = await Promise.all([api('/api/decks').catch(() => []), api(comJog('/api/partidas')).catch(() => ({ partidas: [] }))]);
  itens = itens.concat(
    meus.map(d => ({ tipo: 'Meu deck', nome: d.nome, ico: icones(d.arquetipo), ir: () => { location.hash = 'meudeck-' + d.id; } })),
    S.arqLista.map(a => ({ tipo: 'Perfil de deck', nome: a.nome, ico: icones(a.slug),
      ir: () => { S.deck = a.slug; if (location.hash === '#deck') render(); else location.hash = 'deck'; } })),
    ps.partidas.slice(0, 400).map(p => ({ tipo: 'Partida', nome: `${p.resultado === 'V' ? 'Vitória' : p.resultado === 'D' ? 'Derrota' : '?'} contra ${p.adversario}`,
      extra: `${nomeDeck(p.meu_deck)} x ${nomeDeck(p.deck_adv)} · ${(p.data || '').slice(0, 10).split('-').reverse().join('/')}`,
      ir: () => { location.hash = 'partida-' + p.id; } })));
  if ($('#busca-fundo')) desenhar();
}
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); abrirBusca(); }
});
$('#abrir-busca').onclick = abrirBusca;

/* ---------------- início ---------------- */
(async () => {
  await carregarArquetipos();
  await carregarJogadores();
  await atualizarStatus();
  await render();
  setInterval(atualizarStatus, 4000);
  // primeiro uso: sem nick, sem partidas e sem ter passado pelo guia
  const cfg = S.status?.config || {};
  const partidas = S.jogadores.reduce((a, j) => a + j.partidas, 0);
  if (!cfg.guia_visto && !cfg.nick && !partidas) mostrarGuia();
  else mostrarNovidades(false);
})();
