<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coletor de Partidas TCG Live</title>
<link rel="icon" href="/icone.ico">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: barra lateral de navegação + área de conteúdo; vira barra superior no celular. */
:root {
  --bg: #EEF1F5; --surface: #FFFFFF; --sunken: #F5F7FA; --ink: #172033; --muted: #5B6578; --line: #D5DBE5;
  --accent: #E8B321; --on-accent: #1A1404; --p1: #2B63D9; --p2: #D2432F; --good: #1E8A5A; --bad: #C2382B;
  --c1: #2B63D9; --c2: #D2432F; --c3: #1E8A5A; --c4: #B7791F; --c5: #7B4BC4; --c6: #0F8B99; --c7: #C2477F; --c8: #5B6578;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0F1420; --surface: #171E2C; --sunken: #121826; --ink: #E6EBF3; --muted: #95A0B5; --line: #2A3447;
    --accent: #F2C443; --p1: #6E9BFF; --p2: #FF7A66; --good: #4CC28A; --bad: #FF6B5C;
    --c1: #6E9BFF; --c2: #FF7A66; --c3: #4CC28A; --c4: #E6B54A; --c5: #A78BFA; --c6: #3CC6D6; --c7: #F27BB0; --c8: #95A0B5;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
p { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); }
.app { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; background: linear-gradient(to right, var(--surface) 220px, transparent 220px); }
nav { background: var(--surface); border-right: 1px solid var(--line); padding: 20px 12px; display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; }
nav .marca { font: 800 1.1rem var(--f-display); padding: 0 10px 14px; line-height: 1.2; }
nav .marca small { display: block; font: 500 0.72rem var(--f-body); color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; margin-top: 4px; }
nav a { color: var(--muted); text-decoration: none; padding: 7px 10px; border-radius: 7px; font-weight: 500; }
nav a:hover { color: var(--ink); background: var(--sunken); }
nav a.ativo { color: var(--ink); background: var(--sunken); box-shadow: inset 3px 0 0 var(--accent); }
nav .grupo { font-size: 0.68rem; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); padding: 12px 10px 4px; font-weight: 600; }
nav .estado { margin-top: auto; display: flex; flex-direction: column; gap: 6px; padding: 10px; font-size: 0.8rem; color: var(--muted); }
.luz { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-right: 6px; }
.luz.on { background: var(--good); } .luz.off { background: var(--bad); } .luz.warn { background: var(--accent); }
main { padding: 24px 28px 64px; min-width: 0; display: flex; flex-direction: column; gap: 18px; max-width: 1240px; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
h1 { font-size: 1.6rem; font-weight: 800; } h2 { font-size: 1.15rem; font-weight: 600; } h3 { font-size: 0.98rem; font-weight: 600; }
.sub { color: var(--muted); margin: 2px 0 0; max-width: 70ch; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.grow { flex: 1 1 200px; }
.label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
.num, td.n { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.mono { font-family: var(--f-mono); font-size: 0.82rem; }
button, .btn { font: 500 0.88rem var(--f-body); color: var(--ink); background: var(--sunken); border: 1px solid var(--line); border-radius: 7px; padding: 7px 12px; cursor: pointer; text-decoration: none; display: inline-flex; gap: 6px; align-items: center; }
button:hover, .btn:hover { border-color: var(--muted); }
button.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 600; }
button.perigo { color: var(--bad); }
button:disabled { opacity: 0.5; cursor: default; }
:focus-visible { outline: 2px solid var(--p1); outline-offset: 2px; }
input, select, textarea { font: 400 0.9rem var(--f-body); color: var(--ink); background: var(--sunken); border: 1px solid var(--line); border-radius: 7px; padding: 7px 10px; min-width: 0; }
textarea { font-family: var(--f-mono); font-size: 0.8rem; width: 100%; resize: vertical; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; }
.kpi .v { font: 800 1.7rem var(--f-display); font-variant-numeric: tabular-nums; line-height: 1.1; }
.kpi .d { font-size: 0.8rem; color: var(--muted); }
.tabela { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
.tabela.alta { max-height: 520px; overflow-y: auto; }
table { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
th { position: sticky; top: 0; background: var(--sunken); text-align: left; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; z-index: 1; }
td { padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: none; }
td.n, th.n { text-align: right; }
tr.clicavel { cursor: pointer; } tr.clicavel:hover td { background: var(--sunken); }
.pill { display: inline-block; font-size: 0.74rem; font-weight: 600; padding: 1px 8px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.pill.v { color: #fff; background: var(--good); border-color: var(--good); } .pill.d { color: #fff; background: var(--bad); border-color: var(--bad); } .pill.n { color: var(--muted); }
tr.res-v td:first-child { box-shadow: inset 4px 0 0 var(--good); } tr.res-d td:first-child { box-shadow: inset 4px 0 0 var(--bad); }
tr.res-v td { background: color-mix(in srgb, var(--good) 7%, var(--surface)); } tr.res-d td { background: color-mix(in srgb, var(--bad) 7%, var(--surface)); }
tr.res-v.clicavel:hover td { background: color-mix(in srgb, var(--good) 14%, var(--surface)); } tr.res-d.clicavel:hover td { background: color-mix(in srgb, var(--bad) 14%, var(--surface)); }
nav details.programa { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 6px; display: flex; flex-direction: column; }
nav details.programa summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 7px; color: var(--muted); font-weight: 600; font-size: 0.86rem; }
nav details.programa summary::-webkit-details-marker { display: none; }
nav details.programa summary:hover { color: var(--ink); background: var(--sunken); }
nav details.programa summary .seta { margin-left: auto; transition: transform .2s; } nav details.programa[open] summary .seta { transform: rotate(90deg); }
nav details.programa a { display: block; padding-left: 34px; }
.badge { display: inline-block; min-width: 18px; padding: 0 6px; border-radius: 999px; background: var(--bad); color: #fff; font: 700 .7rem/18px var(--f-body); text-align: center; margin-left: 6px; }
.toast a { color: var(--accent); margin-left: 8px; font-weight: 600; }
.modelo { font-family: var(--f-mono); font-size: .86rem; background: var(--sunken); border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; overflow-wrap: anywhere; }
.modelo b { color: var(--p1); font-weight: 600; }
.tag-sug { font-size: .74rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
.tag-sug.ignorar { background: var(--sunken); color: var(--muted); border: 1px solid var(--line); } .tag-sug.regra { background: var(--accent); color: var(--on-accent); }
.chips-periodo { display: inline-flex; gap: 4px; }
.chips-periodo button { padding: 5px 10px; font-size: .8rem; }
.chips-periodo button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 700; }
.kpi2 { display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.kpi2 .ico-kpi { width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; font-size: 1.1rem; font-weight: 800; }
.kpi2 .ico-kpi.bom { background: color-mix(in srgb, var(--good) 18%, var(--surface)); color: var(--good); }
.kpi2 .ico-kpi.ruim { background: color-mix(in srgb, var(--bad) 18%, var(--surface)); color: var(--bad); }
.kpi2 .ico-kpi.neutro { background: var(--sunken); color: var(--muted); }
.kpi2 .v { font: 800 1.7rem var(--f-display); font-variant-numeric: tabular-nums; line-height: 1.1; }
.kpi2 .d { font-size: .8rem; color: var(--muted); }
.mu-lista { display: flex; flex-direction: column; }
.mu-linha { display: grid; grid-template-columns: minmax(160px, 220px) 1fr 70px 44px; gap: 12px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: .9rem; }
.mu-linha:last-child { border-bottom: none; }
.mu-barra { height: 22px; background: var(--sunken); border-radius: 4px; position: relative; overflow: hidden; }
.mu-barra span { position: absolute; inset: 0 auto 0 0; border-radius: 4px; display: flex; align-items: center; padding-left: 8px; font: 700 .76rem var(--f-mono); color: #fff; min-width: 42px; }
.mu-barra span.bom { background: var(--good); } .mu-barra span.ruim { background: var(--bad); }
.mu-linha .wl { font: .78rem var(--f-mono); color: var(--muted); text-align: right; } .mu-linha .nn { font: .72rem var(--f-mono); color: var(--muted); }
.grade-decks { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.deck-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; text-decoration: none; color: var(--ink); position: relative; }
.deck-card:hover { border-color: var(--muted); }
.deck-card.arquivado { opacity: .55; }
.deck-capa { height: 130px; position: relative; display: grid; place-items: center; overflow: hidden; background: transparent; border-bottom: 1px solid var(--line, rgba(127,127,127,.2)); }
.deck-capa .icones-grandes { position: relative; display: flex; gap: 6px; align-items: center; justify-content: center; }
.deck-capa .icones-grandes img { width: 84px; height: 70px; object-fit: contain; image-rendering: pixelated; filter: drop-shadow(0 2px 2px rgba(0,0,0,.25)); }
.deck-capa .selo { position: absolute; top: 10px; left: 10px; font-size: .72rem; background: rgba(127,127,127,.18); color: var(--muted); padding: 2px 8px; border-radius: 999px; }
.deck-capa .estrela { position: absolute; top: 6px; right: 8px; background: none; border: none; font-size: 1.2rem; color: var(--muted); padding: 2px 4px; }
.deck-capa .lapis { position: absolute; bottom: 6px; right: 8px; background: none; border: none; font-size: .95rem; color: var(--muted); padding: 2px 6px; opacity: .55; }
.deck-card:hover .lapis, .deck-capa .lapis:focus { opacity: 1; }
.deck-capa .corrigido { position: absolute; bottom: 8px; left: 10px; font-size: .68rem; color: var(--muted); }
/* primeiro uso guiado e busca rápida */
.guia-passos { display: flex; gap: 6px; margin: 4px 0 12px; }
.guia-passos span { flex: 1; height: 4px; border-radius: 2px; background: var(--line); }
.guia-passos span.feito { background: var(--accent); }
.guia ol, .guia ul { margin: 6px 0; padding-left: 20px; }
.guia .ok { color: var(--good); font-weight: 600; }
nav .busca-btn { display: flex; align-items: center; gap: 8px; margin: 0 2px 10px; color: var(--muted); background: var(--sunken); justify-content: flex-start; }
nav .busca-btn kbd { margin-left: auto; font: 500 .7rem var(--f-mono); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
.busca { width: min(620px, 100%); align-self: start; margin-top: 10vh; padding: 10px; }
.busca input { width: 100%; font-size: 1rem; padding: 10px 12px; }
.busca ul { list-style: none; margin: 8px 0 0; padding: 0; max-height: 56vh; overflow-y: auto; }
.busca li { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 7px; cursor: pointer; }
.busca li[aria-selected="true"] { background: var(--sunken); box-shadow: inset 3px 0 0 var(--accent); }
.busca li .b-tipo { font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); width: 92px; flex: none; }
.busca li .extra { margin-left: auto; color: var(--muted); font-size: .8rem; white-space: nowrap; }
.janela-fundo { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: grid; place-items: center; z-index: 50; padding: 16px; }
.janela { background: var(--surface); color: var(--ink); border-radius: 12px; padding: 18px; width: min(440px, 100%); box-shadow: 0 10px 40px rgba(0,0,0,.3); }
.janela .previa { display: flex; justify-content: center; gap: 10px; min-height: 76px; margin: 10px 0; }
.janela .previa img { width: 84px; height: 70px; object-fit: contain; image-rendering: pixelated; }
.janela .chips-poke { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 12px; }
.janela .chips-poke button { display: inline-flex; align-items: center; gap: 4px; font-size: .8rem; padding: 2px 8px; }
.janela .chips-poke img { width: 28px; height: 24px; object-fit: contain; image-rendering: pixelated; }
.deck-capa .estrela.on { color: #F2C443; }
.deck-corpo { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 8px; }
.deck-corpo b { font: 700 1rem var(--f-display); }
.deck-nums { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.deck-nums > div { background: var(--sunken); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
.deck-nums .v { font: 700 1.15rem var(--f-mono); }
.deck-novo { border: 2px dashed var(--line); border-radius: 12px; display: grid; place-items: center; text-align: center; min-height: 250px; cursor: pointer; background: transparent; color: var(--muted); }
.deck-novo:hover { border-color: var(--muted); color: var(--ink); }
@media (max-width: 600px) { .mu-linha { grid-template-columns: 1fr 1fr; } .mu-linha .wl, .mu-linha .nn { text-align: left; } }
.aviso-versao { background: var(--accent); color: var(--on-accent); border-radius: 8px; padding: 8px 10px; font-size: .8rem; display: flex; flex-direction: column; gap: 6px; }
.aviso-versao button { background: var(--on-accent); color: var(--accent); border: none; font-size: .78rem; padding: 4px 8px; align-self: flex-start; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 0.8rem; padding: 4px 10px; border-radius: 999px; background: var(--sunken); border: 1px solid var(--line); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.barra { position: relative; height: 10px; background: var(--sunken); border-radius: 5px; overflow: hidden; min-width: 80px; }
.barra > span { position: absolute; top: 0; bottom: 0; left: 0; background: var(--p1); border-radius: 5px; }
.div-barra { position: relative; height: 12px; background: var(--sunken); border-radius: 3px; min-width: 120px; }
.div-barra::after { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--muted); }
.div-barra > span { position: absolute; top: 0; bottom: 0; border-radius: 3px; }
.wr { font-variant-numeric: tabular-nums; font-weight: 600; }
.ic { color: var(--muted); font-size: 0.76rem; font-weight: 400; white-space: nowrap; }
.matriz td { text-align: center; padding: 6px 4px; min-width: 64px; border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.matriz td.cab { text-align: left; font-weight: 600; white-space: nowrap; background: var(--surface); position: sticky; left: 0; z-index: 1; }
.matriz th { text-align: center; white-space: normal; min-width: 64px; font-size: 0.66rem; }
.matriz td small { display: block; font-size: 0.68rem; color: var(--muted); }
.matriz td.pouco { opacity: 0.45; }
.matriz td.espelho { background: var(--sunken); color: var(--muted); }
.chart svg { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font: 11px var(--f-body); }
.chart .grade { stroke: var(--line); stroke-width: 1; }
.legenda { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 0.8rem; color: var(--muted); }
.legenda i { display: inline-block; width: 12px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
.resultado { display: grid; grid-template-columns: 1fr auto 1fr; gap: 16px; align-items: center; }
.lado { display: flex; flex-direction: column; min-width: 0; }
.lado.dir { text-align: right; align-items: flex-end; }
.nome { font: 800 1.3rem var(--f-display); overflow-wrap: anywhere; }
.p1 { color: var(--p1); } .p2 { color: var(--p2); }
.placar { font: 800 2.3rem var(--f-display); font-variant-numeric: tabular-nums; text-align: center; line-height: 1; }
.placar small { display: block; font: 600 0.68rem var(--f-body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-top: 6px; }
.tipo { font: 500 0.72rem var(--f-mono); padding: 1px 6px; border-radius: 4px; background: var(--sunken); border: 1px solid var(--line); white-space: nowrap; }
.tipo.premio { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.dots { display: inline-flex; gap: 3px; } .dots span { width: 8px; height: 11px; border-radius: 2px; background: var(--accent); }
.progresso { height: 8px; background: var(--sunken); border-radius: 4px; overflow: hidden; } .progresso span { display: block; height: 100%; background: var(--accent); transition: width .3s; }
.aviso { border-left: 3px solid var(--accent); padding: 8px 12px; background: var(--sunken); border-radius: 0 7px 7px 0; font-size: 0.88rem; }
.aviso.erro { border-left-color: var(--bad); }
.vazio { color: var(--muted); padding: 28px 0; text-align: center; }
.toast { position: fixed; right: 16px; bottom: 16px; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: 0.9rem; z-index: 20; }
.teste { background: var(--sunken); border: 1px solid var(--line); border-radius: 8px; padding: 10px; font-family: var(--f-mono); font-size: 0.78rem; white-space: pre-wrap; min-height: 40px; }
.regras input[type=text] { width: 100%; font-family: var(--f-mono); font-size: 0.76rem; }
/* áreas da navegação */
nav a.secao { font-size: 0.95rem; padding: 9px 10px; }
/* abas internas de cada seção (Minhas partidas, Meta e torneios) */
.abas { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.abas a { padding: 8px 12px; color: var(--muted); text-decoration: none; font-weight: 500; white-space: nowrap; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.abas a:hover { color: var(--ink); }
.abas a[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
/* quadro "estado da captura" no Início */
.captura { flex-direction: row; align-items: center; gap: 14px; flex-wrap: wrap; }
.captura .luz { width: 12px; height: 12px; margin: 0; flex: none; }
.captura .txt { flex: 1 1 260px; display: flex; flex-direction: column; gap: 2px; }
.captura .txt b { font-size: 1rem; }
details.manual summary { cursor: pointer; font-weight: 600; }
details.manual[open] summary { margin-bottom: 10px; }
.trilha { font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
img.ico { width: 34px; height: 28px; object-fit: contain; vertical-align: middle; margin-right: 2px; flex: none; }
.deck-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 10px; }
.deck-cards figure { margin: 0; position: relative; } .deck-cards img { width: 100%; border-radius: 6px; aspect-ratio: 245/337; background: var(--sunken); }
.deck-cards figcaption { font-size: .72rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.deck-cards .qtd { position: absolute; top: 4px; left: 4px; background: var(--ink); color: var(--bg); font: 700 .78rem var(--f-body); padding: 1px 7px; border-radius: 999px; }
.lista-decks { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }

<div class="app">
  <nav>

<script>
/* =====================================================================
   Painel do Coletor. Conversa com o app.py pelos endereços /api/...
   Cada aba tem uma função render<Nome>() que busca os dados e desenha.
   ===================================================================== */
const $ = s => document.querySelector(s);
const main = $('#main');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (x, d = 1) => x == null ? '–' : Number(x).toLocaleString('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d });
const pct = x => x == null ? '–' : fmt(x) + '%';
const CORES = ['--c1','--c2','--c3','--c4','--c5','--c6','--c7','--c8'].map(v => `var(${v})`);

const AJUDA_CONEXAO = 'Não consegui falar com o programa. Confira: 1) o Coletor está aberto: o ícone dele aparece perto do relógio do Windows (se não estiver, abra pelo atalho Coletor TCG Live da Área de Trabalho ou pelo iniciar_windows.bat); 2) o endereço no navegador é http://127.0.0.1:8765, e não um arquivo aberto com dois cliques; 3) se o Coletor estiver com a janela preta aberta e você clicou dentro dela, aperte Esc nela. Depois recarregue esta página (F5).';
async function api(url, opts = {}) {
  if (location.protocol === 'file:') throw new Error('Esta página foi aberta como arquivo. Ela só funciona pelo programa: abra pelo atalho Coletor TCG Live (ou pelo iniciar_windows.bat) e use o endereço http://127.0.0.1:8765.');
  let r;
  try { r = await fetch(url, { headers: { 'Content-Type': 'application/json' }, ...opts }); }
  catch (e) { throw new Error(AJUDA_CONEXAO); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.erro || (j.erros ? Object.values(j.erros).join('; ') : `Erro ${r.status}`));
  return j;
}
let toastT;
function toast(msg, link, rotulo) {
  const t = $('#toast'); t.textContent = msg;
  if (link) { const a = document.createElement('a'); a.href = '#' + link; a.textContent = rotulo || 'Ver'; t.appendChild(a); }
  t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, link ? 7000 : 2600);
}

const S = { status: null, ultimaVista: null, selTorneios: [], top: 0, corte: 32, deck: '', partida: null, importando: false };

/* ---------------- componentes reutilizáveis ---------------- */
function taxaHtml(g) {
  if (!g || g.taxa == null) return '<span class="muted">–</span>';
  return `<span class="wr">${pct(g.taxa)}</span> <span class="ic">${g.ic_baixo != null ? `${fmt(g.ic_baixo, 0)}–${fmt(g.ic_alto, 0)}%` : ''}</span>`;
}
function barraDivergente(taxa) {
  if (taxa == null) return '<div class="div-barra"></div>';
  const d = Math.max(-50, Math.min(50, taxa - 50));
  const cor = d >= 0 ? 'var(--good)' : 'var(--bad)';
  const esq = d >= 0 ? 50 : 50 + d;
  return `<div class="div-barra" title="${pct(taxa)}"><span style="left:${esq}%;width:${Math.abs(d)}%;background:${cor}"></span></div>`;
}
function corTaxa(taxa) {
  if (taxa == null) return '';
  const d = Math.max(-30, Math.min(30, taxa - 50)) / 30;
  const base = d >= 0 ? 'var(--good)' : 'var(--bad)';
  return `background: color-mix(in srgb, ${base} ${Math.round(Math.abs(d) * 55)}%, var(--surface));`;
}
function tabelaGrupos(lista, titulo, extra, formato) {
  if (!lista.length) return `<p class="muted">Sem dados ainda.</p>`;
  return `<div class="tabela"><table><thead><tr><th>${titulo}</th><th class="n">Partidas</th><th class="n">V–D</th><th>Taxa de vitória</th><th></th>${extra ? '<th>Nos campeonatos</th>' : ''}</tr></thead><tbody>
    ${lista.map(g => `<tr><td>${formato ? formato(g.grupo) : esc(g.grupo)}</td><td class="n">${g.n}</td><td class="n">${g.v}–${g.d}</td><td>${taxaHtml(g)}</td><td style="width:30%">${barraDivergente(g.taxa)}</td>
      ${extra ? `<td>${g.meta_taxa != null ? `${pct(g.meta_taxa)} <span class="ic">${g.meta_n} partidas</span>` : '<span class="muted">–</span>'}</td>` : ''}</tr>`).join('')}
  </tbody></table></div>`;
}
function graficoLinhas(series, rotulosX, { min = 0, max = 100, sufixo = '%', altura = 240 } = {}) {
  const W = 640, H = altura, m = { l: 40, r: 14, t: 12, b: 34 };
  const n = Math.max(rotulosX.length - 1, 1);
  const x = i => m.l + (rotulosX.length === 1 ? (W - m.l - m.r) / 2 : (i / n) * (W - m.l - m.r));
  const y = v => H - m.b - ((v - min) / (max - min || 1)) * (H - m.t - m.b);
  let g = '';
  const passoY = (max - min) / 4;
  for (let k = 0; k <= 4; k++) { const v = min + k * passoY; g += `<line class="grade" x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}"/><text x="${m.l - 6}" y="${y(v) + 4}" text-anchor="end">${fmt(v, 0)}${sufixo}</text>`; }
  const pulo = Math.ceil(rotulosX.length / 8);
  rotulosX.forEach((r, i) => { if (i % pulo === 0 || i === rotulosX.length - 1) g += `<text x="${x(i)}" y="${H - 10}" text-anchor="middle">${esc(r)}</text>`; });
  const linhas = series.map((s, k) => {
    const pts = s.valores.map((v, i) => v == null ? null : [x(i), y(v)]).filter(Boolean);
    if (!pts.length) return '';
    const cor = s.cor || CORES[k % CORES.length];
    const ultimo = pts[pts.length - 1];
    return `<polyline points="${pts.map(p => p.join(',')).join(' ')}" fill="none" stroke="${cor}" stroke-width="2.2" stroke-linejoin="round"/>
      <circle cx="${ultimo[0]}" cy="${ultimo[1]}" r="3.5" fill="${cor}"/>`;
  }).join('');
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img">${g}${linhas}</svg></div>
    <div class="legenda">${series.map((s, k) => `<span><i style="background:${s.cor || CORES[k % CORES.length]}"></i>${esc(s.nome)}</span>`).join('')}</div>`;
}

function graficoPremios(r, a, b) {
  const W = 520, H = 220, m = { l: 30, r: 12, t: 12, b: 28 };
  const n = Math.max(r.turnos, 1);
  const x = t => m.l + (t / n) * (W - m.l - m.r), y = v => H - m.b - (v / 6) * (H - m.t - m.b);
  const deg = s => { if (!s) return ''; let d = `M${x(0)},${y(s[0])}`; for (let t = 1; t < s.length; t++) d += ` H${x(t)} V${y(s[t])}`; return d; };
  let g = '';
  for (let v = 0; v <= 6; v += 2) g += `<line class="grade" x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}"/><text x="${m.l - 8}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  const passo = n > 12 ? 2 : 1;
  for (let t = 0; t <= n; t += passo) g += `<text x="${x(t)}" y="${H - 8}" text-anchor="middle">${t === 0 ? 'Setup' : 'T' + t}</text>`;
  const fim = (s, cor) => s ? `<circle cx="${x(s.length - 1)}" cy="${y(s[s.length - 1])}" r="4" fill="${cor}"/>` : '';
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img">${g}
    <path d="${deg(r.serie[a])}" fill="none" stroke="var(--p1)" stroke-width="2.5"/><path d="${deg(r.serie[b])}" fill="none" stroke="var(--p2)" stroke-width="2.5"/>
    ${fim(r.serie[a], 'var(--p1)')}${fim(r.serie[b], 'var(--p2)')}</svg></div>
    <div class="legenda"><span><i style="background:var(--p1)"></i>${esc(a)}</span><span><i style="background:var(--p2)"></i>${esc(b)}</span></div>`;
}

    <section class="panel"><h2>Tendência do meta</h2><p class="sub">Participação dos 8 decks mais jogados em cada torneio importado, em ordem de data.</p>
      ${tend.torneios.length > 1 ? graficoLinhas(tend.series.map(s => ({ nome: s.nome, valores: tend.torneios.map(t => t.pct[s.arquetipo]) })), tend.torneios.map(t => (t.data || '').slice(5).split('-').reverse().join('/')), { max: Math.max(10, Math.ceil(Math.max(...tend.torneios.flatMap(t => Object.values(t.pct))) / 5) * 5) }) : '<p class="muted">Importe pelo menos dois torneios para ver a tendência.</p>'}
    </section>
    <section class="panel" id="qual-deck"><h2>Qual deck jogar?</h2><p class="muted">Calculando…</p></section>`;
  ligarSeletor(renderMeta);
  desenharQualDeck();
  $('#m-top').onchange = e => { S.top = Number(e.target.value); renderMeta(); };
  $('#m-corte').onchange = e => { S.corte = Number(e.target.value); renderMeta(); };
  document.querySelectorAll('tr[data-arq]').forEach(tr => tr.onclick = () => { S.deck = tr.dataset.arq; location.hash = 'deck'; });
}

// Meta > "Qual deck jogar?": taxa esperada contra o campo e equilíbrio do meta (tracker/estrategia.py).
async function desenharQualDeck() {
  const el = $('#qual-deck'); if (!el) return;
  let q; try { q = await api(`/api/qual-deck?${qsTorneios()}`); } catch (e) { el.innerHTML = `<h2>Qual deck jogar?</h2><p class="aviso erro">${esc(e.message)}</p>`; return; }
  if (!q.decks.length) { el.innerHTML = '<h2>Qual deck jogar?</h2><p class="muted">Sem partidas com os dois decks conhecidos nesta fonte.</p>'; return; }
  el.innerHTML = `<h2>Qual deck jogar?</h2>
    <p class="sub">Para os ${q.decks.length} decks mais jogados, a taxa de vitória esperada contra o campo atual (cada confronto pesado pela presença do adversário).
      Confrontos com poucos jogos são completados pela força geral de cada deck, para não confiar em 3 ou 4 partidas. ${q.partidas.toLocaleString('pt-BR')} partidas.</p>
    <div class="tabela alta"><table><thead><tr><th>Deck</th><th class="n">% do campo</th><th class="n">Esperada contra o campo</th><th>Pior confronto</th>
      <th class="n" title="Mistura de decks que nenhum outro consegue explorar (teoria dos jogos)">No equilíbrio</th><th class="n" title="Taxa esperada se o campo jogasse a mistura de equilíbrio">Contra o equilíbrio</th></tr></thead><tbody>
      ${q.decks.map(d => `<tr class="clicavel" data-arq="${esc(d.arquetipo)}"><td><span class="cel-carta">${icones(d.arquetipo)}<b>${esc(nomeDeck(d.arquetipo))}</b></span></td>
        <td class="n">${pct(d.campo)}</td><td class="n" style="${corTaxa(d.esperada)}"><b>${pct(d.esperada)}</b></td>
        <td>${d.pior ? `${deckHtml(d.pior)} <span class="muted">${pct(d.pior_p)} · ${d.pior_n} jogos</span>` : ''}</td>
        <td class="n">${d.equilibrio ? pct(d.equilibrio) : '<span class="muted">0%</span>'}</td><td class="n">${pct(d.contra_equilibrio)}</td></tr>`).join('')}
    </tbody></table></div>
    <p class="muted" style="font-size:.85rem">"No equilíbrio" mostra a mistura de decks que nenhum outro deck consegue explorar. Um deck muito jogado com 0% ali está sendo superestimado pelo campo; um pouco jogado com peso alto pode ser uma boa surpresa. São estimativas a partir dos campeonatos importados, não garantias.</p>`;
  el.querySelectorAll('tr[data-arq]').forEach(tr => tr.onclick = () => { S.deck = tr.dataset.arq; location.hash = 'deck'; });
}

// Perfil de deck > Versões pela ACE SPEC (tracker/variantes.py): tabela de cada ACE SPEC e as versões do deck.
async function desenharVariantes(arq) {
  const alvo = $('#variantes') || (() => { const s = document.createElement('section'); s.className = 'panel'; s.id = 'variantes'; main.appendChild(s); return s; })();
  alvo.innerHTML = '<h2>ACE SPEC e versões</h2><p class="muted">Separando as listas…</p>';
  let v; try { v = await api(`/api/variantes/${encodeURIComponent(arq)}?${qsTorneios()}`); } catch (e) { alvo.innerHTML = `<h2>ACE SPEC e versões</h2><p class="aviso erro">${esc(e.message)}</p>`; return; }
  if (S.deck !== arq || !$('#variantes')) return;
  if (!v.listas) { alvo.innerHTML = '<h2>ACE SPEC e versões</h2><p class="muted">Nenhuma lista importada deste deck.</p>'; return; }
  const marca = g => g.diferenca ? ` <span class="pill ${g.taxa >= (v.aces.reduce((a, x) => a + x.v, 0) / Math.max(1, v.aces.reduce((a, x) => a + x.n, 0)) * 100) ? 'v' : 'd'}" title="A taxa desta escolha é diferente do resto do deck com p = ${g.p_valor}: dificilmente é sorte">diferença provável</span>` : '';
  alvo.innerHTML = `<h2>ACE SPEC e versões</h2>
    <p class="sub">Cada deck leva 1 ACE SPEC, e essa escolha costuma definir a versão. ${v.listas} listas deste deck.</p>
    <div class="tabela"><table><thead><tr><th>ACE SPEC</th><th class="n">Listas</th><th class="n">% do deck</th><th>Taxa de vitória</th><th class="n">V–D–E</th></tr></thead><tbody>
      ${v.aces.map(a => `<tr><td><b>${esc(a.ace)}</b>${marca(a)}</td><td class="n">${a.listas}</td><td class="n">${pct(a.pct)}</td><td>${taxaHtml(a)}</td><td class="n">${a.v}–${a.d}–${a.e}</td></tr>`).join('')}
    </tbody></table></div>
    ${v.grupos.length ? `<h3>Versões</h3>
      <p class="muted" style="font-size:.85rem">ACE SPEC usadas por poucas listas entram na versão com o resto da lista mais parecido; duas ACE SPEC com listas quase iguais viram uma versão só.</p>
      <div class="grid2">${v.grupos.map(g => `<div class="panel" style="padding:12px;gap:6px">
        <div class="row"><b class="grow">${esc(g.aces[0].ace)}${g.aces.length > 1 ? ` <span class="muted" style="font-weight:400">+ ${g.aces.slice(1).map(a => `${esc(a.ace)} (${a.listas})`).join(', ')}</span>` : ''}</b><span class="muted">${g.listas} listas</span></div>
        <div>${taxaHtml(g)} <span class="muted">${g.v}–${g.d}–${g.e}</span>${marca(g)}</div>
        <ul style="margin:0;padding-left:18px;font-size:.88rem">${g.marcas.map(m => `<li>${esc(m.carta)}: <b>${fmt(m.media, 1)}</b> cópias <span class="muted">(média do deck ${fmt(m.geral, 1)})</span></li>`).join('')}</ul></div>`).join('')}</div>`
      : `<p class="muted">${v.aces.length > 1 ? 'Uma versão principal: as outras ACE SPEC são usadas por poucas listas (veja a tabela acima).' : 'Todas as listas usam a mesma ACE SPEC.'}</p>`}
    <p class="muted" style="font-size:.85rem">"Diferença provável": a taxa daquela escolha é diferente da do resto do deck com menos de 5% de chance de ser só sorte. Com várias ACE SPEC comparadas ao mesmo tempo, uma ou outra pode aparecer por acaso; confira o número de jogos.</p>`;
}

  main.innerHTML = `
    ${trilha()}<header><h1>Matchups</h1><p class="sub">Leia pela linha: taxa de vitória do deck da linha contra o deck da coluna. Células apagadas têm menos de ${S.minMu} partidas.</p></header>
    ${seletorTorneios()}
    <div class="row">
      <label class="label" for="mu-k">Decks na tabela</label><select id="mu-k">${[6,8,10,12,15,20].map(v => `<option ${S.k == v ? 'selected' : ''}>${v}</option>`).join('')}</select>
      <label class="label" for="mu-tipo">Mostrar</label><select id="mu-tipo"><option value="real" ${S.muTipo !== 'ajustada' ? 'selected' : ''}>Taxa real</option>

      <label class="label" for="mu-min">Mínimo de partidas</label><select id="mu-min">${[0,5,10,20,50].map(v => `<option ${S.minMu == v ? 'selected' : ''}>${v}</option>`).join('')}</select>
      <span class="grow"></span><a class="btn" href="/exportar/torneios.csv">Baixar partidas dos torneios</a>
    </div>
    ${S.muTipo === 'ajustada' ? '<p class="muted" style="font-size:.85rem">Taxa ajustada: com muitos jogos vale o resultado real do confronto; com poucos, ele é completado pela força geral de cada deck contra todo o campo. Prevê os torneios seguintes melhor que a taxa real (testado). Passe o mouse para ver a taxa real.</p>' : ''}
    <section class="panel"><div class="tabela"><table class="matriz">
      <thead><tr><th></th>${m.colunas.map(c => `<th>${icones(c.arquetipo)}<br>${esc(c.nome)}</th>`).join('')}</tr></thead>
      <tbody>${m.matriz.map(l => `<tr><td class="cab"><span class="cel-carta">${icones(l.arquetipo)}${esc(l.nome)}</span></td>${l.celulas.map((c, i) => c.espelho ? '<td class="espelho">mirror</td>'
        : S.muTipo === 'ajustada'
          ? `<td style="${corTaxa(c.ajustada)}" title="${esc(l.nome)} contra ${esc(m.colunas[i].nome)}: ajustada ${pct(c.ajustada)}; real ${c.n ? pct(c.taxa) : '–'} em ${c.n} partidas (${c.v}-${c.d}-${c.e})">${pct(c.ajustada)}<small>${c.n || ''}</small></td>`
          : `<td class="${c.pouco ? 'pouco' : ''}" style="${c.n ? corTaxa(c.taxa) : ''}" title="${esc(l.nome)} contra ${esc(m.colunas[i].nome)}: ${c.v}-${c.d}-${c.e} (${c.n} partidas)">${c.n ? pct(c.taxa) : '–'}<small>${c.n || ''}</small></td>`).join('')}</tr>`).join('')}</tbody>
    </table></div></section>`;
  ligarSeletor(renderMatchups);
  $('#mu-k').onchange = e => { S.k = Number(e.target.value); renderMatchups(); };
  $('#mu-min').onchange = e => { S.minMu = Number(e.target.value); renderMatchups(); };
  $('#mu-tipo').onchange = e => { S.muTipo = e.target.value; renderMatchups(); };
}

    <div class="row" style="align-items:flex-start;gap:16px;flex-wrap:nowrap">

      <div class="kpi"><span class="label">Taxa esperada contra o campo</span><span class="v">${pct(p.taxa_esperada)}</span><span class="d">matchups ponderados pela presença de cada deck</span></div>
      <div class="kpi"><span class="label">No Top 8</span><span class="v">${p.colocacoes['Top 8']}</span><span class="d">${p.colocacoes['Top 32']} no Top 32</span></div>
      <div class="kpi"><span class="label">Listas analisadas</span><span class="v">${p.listas}</span><span class="d">importadas do Labs</span></div>
    </div></div>
    <section class="panel"><h2>Matchups contra o campo</h2>
      <div class="tabela alta"><table><thead><tr><th>Contra</th><th class="n">% do campo</th><th>Taxa de vitória</th><th></th><th class="n">V–D–E</th></tr></thead><tbody>
      ${p.spread.filter(s => s.n).map(s => `<tr><td><span class="cel-carta">${icones(s.arquetipo)}${esc(s.nome)}</span>${s.arquetipo === p.arquetipo ? ' <span class="muted">(mirror)</span>' : ''}</td><td class="n">${pct(s.pct_campo)}</td><td>${taxaHtml(s)}</td><td style="width:28%">${barraDivergente(s.taxa)}</td><td class="n">${s.v}–${s.d}–${s.e}</td></tr>`).join('')}
      </tbody></table></div></section>
    <div class="grid2">
      <section class="panel"><h2>Melhores colocações</h2>
        <table><thead><tr><th class="n">Pos.</th><th>Jogador</th><th>Torneio</th><th>ACE SPEC</th><th class="n">V–D–E</th></tr></thead><tbody>
        ${p.melhores.map(j => `<tr><td class="n">${j.posicao}</td><td>${esc(j.nome)}</td><td class="muted">${esc((S.torneios.find(t => t.id === j.torneio) || {}).nome || j.torneio)}</td><td>${j.ace_spec == null ? '<span class="muted">sem lista</span>' : j.ace_spec ? esc(j.ace_spec) : '<span class="muted">nenhuma</span>'}</td><td class="n">${j.v}–${j.d}–${j.e}</td></tr>`).join('')}
        </tbody></table></section>
      <section class="panel"><h2>Presença por torneio</h2>
        ${p.por_torneio.length > 1 ? graficoLinhas([{ nome: p.nome, valores: p.por_torneio.map(t => t.pct), cor: 'var(--p1)' }], p.por_torneio.map(t => (t.data || '').slice(5).split('-').reverse().join('/')), { max: Math.max(10, Math.ceil(Math.max(...p.por_torneio.map(t => t.pct)) / 5) * 5) }) : '<p class="muted">Importe mais torneios para ver a evolução.</p>'}
        <table><tbody>${Object.entries(p.colocacoes).map(([k, v]) => `<tr><td>${k}</td><td class="n">${v}</td></tr>`).join('')}</tbody></table>
      </section>
    </div>

      ${p.esqueleto.length ? tabelaCartas(p.esqueleto) : '<p class="muted">Nenhuma lista importada para este deck. Ao importar um torneio, escolha quantas listas do topo baixar.</p>'}

function tabelaCartas(cartas) {
  return `<div class="tabela alta"><table><thead><tr><th>Carta</th><th class="n">% das listas</th><th class="n">Média de cópias</th><th title="Para cada número de cópias: quantas listas e a taxa de vitória delas (0× = listas sem a carta)">Cópias: listas (vitória)</th><th class="n">Vitória com</th><th class="n">Vitória sem</th></tr></thead><tbody>
    ${cartas.map(c => `<tr><td><span class="cel-carta">${mini(c.carta, c.carta_id)}${esc(c.carta)}</span></td><td class="n">${pct(c.pct)}</td><td class="n">${fmt(c.media_copias, 2)}</td>
      <td class="num" style="font-size:.8rem">${Object.entries(c.por_copias || {}).map(([q, x]) => `<span title="${x.listas} listas com ${q} cópia(s)" style="white-space:nowrap"><b>${q}×</b> ${x.listas} <span style="${x.taxa != null ? 'color:' + (x.taxa >= 50 ? 'var(--good)' : 'var(--bad)') : ''}">(${pct(x.taxa)})</span></span>`).join(' · ')}</td>
      <td class="n">${pct(c.taxa_com)}</td><td class="n">${pct(c.taxa_sem)}</td></tr>`).join('')}
  </tbody></table></div>`;
}

async function renderCartas() {
  await carregarTorneios();

  const com = S.torneios.filter(t => t.qtd_listas);
  main.innerHTML = `
    ${trilha()}<header><h1>Cartas</h1><p class="sub">Quanto cada carta é usada e o desempenho de quem a usa ("Vitória com") contra quem não usa ("Vitória sem"). Diferença grande pode ser sinal, mas não prova causa.</p></header>
    ${seletorTorneios()}
    <div class="row"><label class="label" for="c-deck">Deck</label>
      <select id="c-deck"><option value="">Todos os decks</option>${m.divisao.map(d => `<option value="${esc(d.arquetipo)}" ${d.arquetipo === S.deckCartas ? 'selected' : ''}>${esc(d.nome)}</option>`).join('')}</select>
      <span class="muted num">${c.listas} listas</span></div>
    <section class="panel">${c.cartas.length ? tabelaCartas(c.cartas) : '<p class="muted">Nenhuma lista importada. Ao importar um torneio, deixe "listas do topo" maior que zero.</p>'}</section>
    <section class="panel"><h2>Comparar duas listas</h2>

        <div class="row"><select id="cmp-tb">${com.map(t => `<option value="${t.id}">${esc(t.nome)}</option>`).join('')}</select><select id="cmp-ib" class="grow"></select></div>

    };

    };
  }
}

  if (!S.cmuCarta || !candidatas.some(c => c.chave === S.cmuCarta)) S.cmuCarta = candidatas[0]?.chave || '';
  const r = S.cmuCarta ? await api(`/api/cartas/matchups?${qsTorneios()}&arq=${encodeURIComponent(S.cmuDeck)}&carta=${encodeURIComponent(S.cmuCarta)}&min=${S.minMu ?? 5}`).catch(() => null) : null;

  main.innerHTML = `
    ${trilha()}<header><h1>Cartas x matchups</h1><p class="sub">Para um deck, compara a taxa de vitória contra cada adversário conforme quantas cópias de uma carta a lista tinha. Ajuda a decidir se uma carta de tech ou uma cópia a mais vale o espaço. Mirrors não contam.</p></header>
    ${seletorTorneios()}
    <div class="row">
      <span class="cel-carta">${icones(S.cmuDeck)}</span>
      <select id="cmu-deck">${m.divisao.map(d => `<option value="${esc(d.arquetipo)}" ${d.arquetipo === S.cmuDeck ? 'selected' : ''}>${esc(d.nome)}</option>`).join('')}</select>

      : '<p class="muted">Sem partidas suficientes para esta combinação.</p>'}

function seloFormato(t) {
  if (t.formato === 'standard') return '<span class="pill v" title="O Limitless marca este torneio como Standard">Standard ✓</span>';
  if (t.formato) return `<span class="pill d" title="Fica fora das contas: o programa só usa Standard">${esc(t.formato)}: fora das contas</span>`;
  return '<span class="pill n" title="Ainda não deu para confirmar o formato no Limitless; entra nas contas">formato não confirmado</span>';
}
async function renderTorneios() {

        <span class="grow"></span><button id="s-agora">Verificar agora</button>
      </div>
      <div class="row">
        <label class="row" style="gap:6px"><input type="checkbox" id="s-online" ${cfg.online_ativo !== false ? 'checked' : ''}> Importar também torneios online Standard do Limitless</label>
        <label class="label" for="s-online-min">com pelo menos</label>
        <select id="s-online-min">${[32, 64, 128, 256].map(v => `<option value="${v}" ${(cfg.online_min_jogadores ?? 64) == v ? 'selected' : ''}>${v} jogadores</option>`).join('')}</select>
        <label class="label" for="s-online-dias">dos últimos</label>
        <select id="s-online-dias">${[7, 14, 21, 30, 45].map(v => `<option value="${v}" ${(cfg.online_dias ?? 21) == v ? 'selected' : ''}>${v} dias</option>`).join('')}</select>

    </section>
    <section class="panel"><h2>Importar um torneio específico</h2>
      <div class="row">

    </section>
    <section class="panel"><h2>Torneios online importados</h2>
      ${online.length ? `<p class="muted">${online.length} torneios, ${online.reduce((a, t) => a + (t.jogadores || 0), 0).toLocaleString('pt-BR')} jogadores, ${online.reduce((a, t) => a + (t.qtd_partidas || 0), 0).toLocaleString('pt-BR')} partidas.</p>

  $('#s-horas').onchange = e => salvarCfg({ sincronizar_horas: Number(e.target.value) });

  $('#s-online-dias').onchange = e => salvarCfg({ online_dias: Number(e.target.value) });
  $('#t-listas').onchange = e => api('/api/config', { method: 'POST', body: JSON.stringify({ listas_top: Number(e.target.value) || 0 }) });
  $('#s-agora').onclick = async () => {
    try { await api('/api/sincronizar', { method: 'POST' }); toast('Verificando torneios novos…'); setTimeout(atualizarStatus, 800); }
    catch (e) { toast(e.message); }
  };
  atualizarSync(st.sincronizacao);
  const importar = async id => {
    S.listasTop = Number($('#t-listas').value) || 0;
    try { await api('/api/limitless/importar', { method: 'POST', body: JSON.stringify({ id, listas_top: S.listasTop }) });
      $('#t-prog').hidden = false; toast(`Importando ${id}…`); setTimeout(atualizarStatus, 500); }
    catch (e) { toast(e.message); }
  };
  $('#t-importar-id').onclick = () => importar($('#t-id').value.trim());
  document.querySelectorAll('[data-reimp]').forEach(b => b.onclick = () => importar(b.dataset.reimp));
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    if (!confirm('Apagar este torneio do banco local?')) return;
    await api('/api/torneios/' + b.dataset.del, { method: 'DELETE' }); toast('Torneio apagado'); renderTorneios();
  });
  $('#t-buscar').onclick = async () => {
    $('#t-lista').innerHTML = '<p class="muted">Buscando…</p>';
    try {
      const evs = await api('/api/limitless/eventos');
      const ja = new Set(S.torneios.map(t => t.id));
      $('#t-lista').innerHTML = `<div class="tabela alta"><table><thead><tr><th>Nº</th><th>Torneio</th><th></th></tr></thead><tbody>
        ${evs.map(e => `<tr><td class="mono">${e.id}</td><td>${esc(e.titulo)}</td><td>${ja.has(e.id) ? '<span class="pill v">importado</span>' : `<button data-imp="${e.id}">Importar</button>`}</td></tr>`).join('')}</tbody></table></div>`;
      document.querySelectorAll('[data-imp]').forEach(b => b.onclick = () => importar(b.dataset.imp));
    } catch (e) { $('#t-lista').innerHTML = `<p class="aviso erro">${esc(e.message)}</p>`; }
  };
}
function atualizarSync(s) {
  const el = $('#s-info'); if (!el) return;
  el.textContent = [s.rodando ? 'Verificando agora…' : '', s.ultima ? `Última verificação: ${s.ultima}` : 'Ainda não verificou nesta sessão',
    s.proxima && s.ligado ? `próxima: ${s.proxima}` : '', s.mensagem && !s.rodando ? s.mensagem : ''].filter(Boolean).join(' · ');
}
function atualizarProgresso(imp) {
  if (!$('#t-prog')) return;
  if (imp.ativo || imp.erro || imp.resumo) $('#t-prog').hidden = false;
  $('#t-etapa').textContent = imp.etapa || ''; $('#t-pct').textContent = (imp.pct || 0) + '%';
  $('#t-barra').style.width = (imp.pct || 0) + '%'; $('#t-msg').textContent = imp.resumo || '';
  $('#t-erro').hidden = !imp.erro; $('#t-erro').textContent = imp.erro || '';
}

// Ajustes > Como abrir o programa: atalho na Área de Trabalho e abrir junto com o Windows.
async function desenharAtalhos() {
  const el = $('#a-atalhos'); if (!el) return;
  try { S.atalhos = await api('/api/atalhos'); } catch (e) { el.innerHTML = `<span class="aviso erro">${esc(e.message)}</span>`; return; }
  const a = S.atalhos;
  el.innerHTML = `
    <span><span class="luz ${a.area ? 'on' : ''}"></span>Atalho na Área de Trabalho</span>
    <button id="at-area">${a.area ? 'Refazer atalho' : 'Criar atalho'}</button>
    <span style="margin-left:12px"><span class="luz ${a.inicializar ? 'on' : ''}"></span>Abrir sozinho quando o Windows liga</span>
    <button id="at-ini">${a.inicializar ? 'Desligar' : 'Ligar'}</button>`;
  const mudar = async (corpo, msg) => {
    try { await api('/api/atalhos', { method: 'POST', body: JSON.stringify(corpo) }); toast(msg); }
    catch (e) { toast(e.message); }
    desenharAtalhos();
  };
  $('#at-area').onclick = () => mudar({ area: true }, 'Atalho criado na Área de Trabalho');

}

  };

  $('#a-salvar-nick').onclick = () => salvar({ nick: $('#a-nick').value.trim() }).then(() => toast('Nick salvo'));

  if ($('#a-instalar')) $('#a-instalar').onclick = async () => {

    renderAjustes();

  if (st.windows) desenharAtalhos();
  if ($('#a-abrir-em')) $('#a-abrir-em').onchange = e => salvar({ abrir_em: e.target.value }).then(() => toast('Vale na próxima vez que o painel abrir'));
  $('#a-guia').onclick = () => mostrarGuia();
  $('#a-encerrar').onclick = async () => {

      ${r.encontrados.length ? `<p class="aviso">Arquivos que parecem conter o log:</p><ul class="mono">${r.encontrados.map(x => `<li>${esc(x.arquivo)} (${x.tamanho_kb} KB)</li>`).join('')}</ul>`

async function renderRegras() {
  const d = await api('/api/regras');
  S.regras = S.regras || d.regras;
  main.innerHTML = `
    ${trilha()}<header><h1>Regras de leitura</h1><p class="sub">Cada linha do log é comparada com estas expressões regulares. Grupos nomeados viram colunas: <span class="mono">(?P&lt;player&gt;…)</span>, <span class="mono">(?P&lt;card&gt;…)</span>, <span class="mono">(?P&lt;target&gt;…)</span>, <span class="mono">(?P&lt;dano&gt;\\d+)</span>. Ao salvar, todas as partidas são relidas.</p></header>
    <section class="panel">
      <div class="tabela"><table class="regras"><thead><tr><th>Ativa</th><th>Nome</th><th>Tipo</th><th style="width:60%">Expressão regular</th><th></th></tr></thead><tbody>
      ${S.regras.map((r, i) => `<tr><td><input type="checkbox" data-i="${i}" class="r-ativa" ${r.ativa ? 'checked' : ''}></td>
        <td><input type="text" data-i="${i}" class="r-id" value="${esc(r.id)}" style="width:120px"></td>
        <td><select data-i="${i}" class="r-tipo">${Object.entries(d.tipos).map(([k, t]) => `<option value="${k}" ${r.tipo === k ? 'selected' : ''}>${t}</option>`).join('')}</select></td>
        <td><input type="text" data-i="${i}" class="r-re" value="${esc(r.re)}" spellcheck="false">${d.erros[r.id] ? `<div class="aviso erro">${esc(d.erros[r.id])}</div>` : ''}</td>
        <td><button class="perigo r-del" data-i="${i}">Remover</button></td></tr>`).join('')}
      </tbody></table></div>
      <div class="row"><button class="primary" id="r-salvar">Salvar e reler partidas</button><button id="r-nova">Nova regra</button><button id="r-padrao">Restaurar padrão</button></div>
    </section>
    <section class="panel"><h2>Testar uma linha</h2>
      <input id="r-teste" placeholder="Cole uma linha do log" spellcheck="false"><div class="teste" id="r-out">Nenhuma linha testada.</div>
    </section>`;
  const set = (cls, campo, conv = x => x) => document.querySelectorAll(cls).forEach(el => el.oninput = el.onchange = () => { S.regras[el.dataset.i][campo] = conv(el); });
  set('.r-ativa', 'ativa', el => el.checked); set('.r-id', 'id', el => el.value); set('.r-tipo', 'tipo', el => el.value); set('.r-re', 're', el => el.value);
  document.querySelectorAll('.r-del').forEach(b => b.onclick = () => { S.regras.splice(Number(b.dataset.i), 1); renderRegras(); });
  $('#r-nova').onclick = () => { S.regras.push({ id: 'regra_' + (S.regras.length + 1), tipo: 'outro', ativa: true, re: '^(?P<player>.+?) ' }); renderRegras(); };
  $('#r-salvar').onclick = async () => {
    try { const r = await api('/api/regras', { method: 'POST', body: JSON.stringify({ regras: S.regras }) }); toast(`Regras salvas. ${r.reprocessadas} partidas relidas.`); S.regras = null; renderRegras(); }
    catch (e) { toast(e.message); }
  };
  $('#r-padrao').onclick = async () => { if (!confirm('Voltar às regras originais?')) return; await api('/api/regras', { method: 'POST', body: JSON.stringify({ restaurar: true }) }); S.regras = null; toast('Regras padrão restauradas'); renderRegras(); };
  $('#r-teste').oninput = async e => {
    const r = await api('/api/regras/testar', { method: 'POST', body: JSON.stringify({ linha: e.target.value, regras: S.regras }) }).catch(err => ({ erro: err.message }));
    $('#r-out').textContent = r.erro ? r.erro : r.length ? r.map(x => `✓ ${x.id} (${x.tipo})\n` + Object.entries(x.grupos).map(([k, v]) => `    ${k} = "${v}"`).join('\n')).join('\n\n') : 'Nenhuma regra leu esta linha.';
  };
}

const COR_ENERGIA = { Grass: '#3f9b4b', Fire: '#e2552b', Water: '#2f86d6', Lightning: '#f0c419', Psychic: '#9a55c4', Fighting: '#b8692c',
  Darkness: '#2f3540', Metal: '#9aa5b1', Fairy: '#e07bb5', Dragon: '#b0912a', Colorless: '#e9ecef', Special: '#ffffff' };
const ROTULO = { ataque: 'Ataque', habilidade: 'Habilidade', jogada: 'Carta jogada', evolucao: 'Evolução', anexo: 'Ligou à mesa',
  nocaute: 'Nocaute', premio: 'Prêmio', entrou: 'Entrou em jogo', recuo: 'Recuo', troca: 'Novo Pokémon Ativo', compra: 'Comprou',
  turno: 'Novo turno', fim: 'Fim de partida', banco: 'Para o Banco', dano: 'Dano', descarte: 'Descarte', info: '' };

function anexoHtml(a) {
  if (a.tipo === 'energia' && a.energia !== 'Special') return `<i class="en" style="background:${COR_ENERGIA[a.energia] || '#fff'}" title="${esc(a.nome)}"></i>`;
  return `<img class="fer" src="${imgNome(a.nome)}" title="${esc(a.nome)}" alt="${esc(a.nome)}">`;
}
function imgMesa(j, nome) {
  const id = S.rp?.r?.versoes?.[j]?.[nome];
  return id ? imgId(id) : imgNome(nome);
}
function cartaMesa(p, tam, d, j) {
  if (!p) return `<div class="carta vazia" title="Sem Pokémon Ativo"></div>`;
  const cls = ['carta', tam, d.uid === p.uid ? 'foco' : '', d.alvo_uid === p.uid ? 'alvo' : ''].join(' ');
  return `<div class="${cls}" title="${esc(p.nome)}${p.dano ? ` · ${p.dano} de dano` : ''}"><img src="${imgMesa(j, p.nome)}" alt="${esc(p.nome)}">
    ${p.dano ? `<span class="dano">${p.dano}</span>` : ''}<div class="anexos">${p.anexos.map(anexoHtml).join('')}</div></div>`;
}
function ladoMesa(j, m, q, cima, cor) {
  const d = q.destaque;
  const info = `<div class="lado-info"><span class="rp-nome ${cor}">${esc(j)}${q.vez === j ? '<span class="rp-vez">vez</span>' : ''}</span>
    <div class="premios" title="${m.premios} prêmios restantes">${Array.from({ length: 6 }, (_, i) => `<span class="${i < m.premios ? 'cheio' : ''}"></span>`).join('')}</div>
    <span>${m.premios} prêmio${m.premios === 1 ? '' : 's'} restante${m.premios === 1 ? '' : 's'}</span>
    ${m.nocauteados.length ? `<span class="ko-lista">Nocauteados: ${m.nocauteados.map(esc).join(', ')}</span>` : ''}</div>`;
  const banco = `<div class="banco">${m.banco.map(p => cartaMesa(p, 'peq', d, j)).join('') || '<span style="opacity:.6;font-size:.8rem">Banco vazio</span>'}</div>`;
  const ativo = cartaMesa(m.ativo, 'grande', d, j);
  return `<div class="lado-mesa">${info}<div class="campo">${cima ? banco + ativo : ativo + banco}</div></div>`;
}

async function renderReplay(id) {
  main.innerHTML = '<p class="vazio">Montando o replay…</p>';
  const r = await api(`/api/partidas/${id}/replay`);
  if (!r.quadros.length) { main.innerHTML = '<div class="aviso erro">Não consegui montar o replay desta partida.</div>'; return; }
  const eu = r.jogadores.includes(r.eu) ? r.eu : r.jogadores[0];
  const adv = r.jogadores.find(j => j !== eu) || '';
  S.rp = { r, i: 0, eu, adv, timer: null, vel: S.rp?.vel || 900 };
  const turnos = r.quadros.map((q, i) => ({ q, i })).filter(x => x.q.destaque.tipo === 'turno' && x.q.vez);
  main.innerHTML = `
    <div class="row"><a class="btn" href="#partida-${id}">← Detalhes da partida</a></div>
    ${trilha()}<header><h1>Replay: ${esc(eu)} x ${esc(adv)}</h1><p class="sub">${r.vencedor ? `Vitória de <b>${esc(r.vencedor)}</b>. ` : ''}${r.turnos} turnos. Use as setas do teclado ou os botões para avançar.</p></header>
    <div class="controles">
      <button id="rp-ini" title="Início">⏮</button><button id="rp-ant" title="Anterior (←)">◀</button>
      <button id="rp-play" class="primary" title="Reproduzir (espaço)">▶ Reproduzir</button>
      <button id="rp-prox" title="Próximo (→)">▶</button><button id="rp-fim" title="Fim">⏭</button>
      <input type="range" id="rp-barra" min="0" max="${r.quadros.length - 1}" value="0" aria-label="Posição no replay">
      <select id="rp-turno" aria-label="Ir para o turno"><option value="">Ir para o turno…</option>${turnos.map((t, k) => `<option value="${t.i}">Turno ${k + 1} · ${esc(t.q.vez)}</option>`).join('')}</select>
      <select id="rp-vel" aria-label="Velocidade">${[[1600, 'Lento'], [900, 'Normal'], [450, 'Rápido']].map(([v, t]) => `<option value="${v}" ${S.rp.vel == v ? 'selected' : ''}>${t}</option>`).join('')}</select>
    </div>
    <div class="replay">
      <div class="mesa" id="rp-mesa"></div>
      <aside class="rp-lateral">
        <section class="panel" id="rp-destaque"></section>
        <div class="rp-log" id="rp-log">${r.quadros.map((q, i) => `<div data-i="${i}" class="${q.destaque.tipo === 'turno' ? 'turno' : ''}">${q.destaque.tipo === 'turno' && q.vez ? `Turno ${turnos.findIndex(t => t.i === i) + 1} · ` : ''}${esc(q.texto)}</div>`).join('')}</div>
      </aside>
    </div>`;
  const ir = i => { S.rp.i = Math.max(0, Math.min(r.quadros.length - 1, i)); desenharQuadro(); };
  $('#rp-ini').onclick = () => ir(0); $('#rp-fim').onclick = () => ir(r.quadros.length - 1);
  $('#rp-ant').onclick = () => ir(S.rp.i - 1); $('#rp-prox').onclick = () => ir(S.rp.i + 1);
  $('#rp-barra').oninput = e => ir(Number(e.target.value));
  $('#rp-turno').onchange = e => { if (e.target.value !== '') ir(Number(e.target.value)); e.target.value = ''; };
  $('#rp-vel').onchange = e => { S.rp.vel = Number(e.target.value); if (S.rp.timer) { alternarPlay(); alternarPlay(); } };
  $('#rp-play').onclick = alternarPlay;
  $('#rp-log').onclick = e => { const d = e.target.closest('[data-i]'); if (d) ir(Number(d.dataset.i)); };
  desenharQuadro();
}
function alternarPlay() {
  if (!S.rp) return;
  if (S.rp.timer) { clearInterval(S.rp.timer); S.rp.timer = null; }
  else {
    if (S.rp.i >= S.rp.r.quadros.length - 1) S.rp.i = 0;
    S.rp.timer = setInterval(() => {
      if (S.rp.i >= S.rp.r.quadros.length - 1) { alternarPlay(); return; }
      S.rp.i++; desenharQuadro();
    }, S.rp.vel);
  }
  const b = $('#rp-play'); if (b) b.textContent = S.rp.timer ? '⏸ Pausar' : '▶ Reproduzir';
}
function desenharQuadro() {
  const { r, i, eu, adv } = S.rp;
  const q = r.quadros[i], e = q.estado, d = q.destaque;
  const est = e.estadio;
  $('#rp-mesa').innerHTML = `
    ${adv ? ladoMesa(adv, e.mesa[adv], q, true, 'p2') : ''}
    <div class="centro-mesa">
      <span>Turno ${Math.max(q.turno, 0)}${q.vez ? ` · vez de <b>${esc(q.vez)}</b>` : ''}</span>
      <span class="estadio">${est ? `<img src="${imgNome(est.nome)}" alt="">Estádio: <b>${esc(est.nome)}</b>` : 'Sem Estádio'}</span>
      ${e.resultado ? `<span class="rp-vez">${esc(e.resultado)} venceu</span>` : ''}
    </div>
    ${ladoMesa(eu, e.mesa[eu], q, false, 'p1')}`;
  const carta = d.carta || (d.tipo === 'turno' ? null : null);
  $('#rp-destaque').innerHTML = `<div class="rp-destaque">
      ${carta ? `<img src="${imgNome(carta, true)}" alt="${esc(carta)}">` : '<div></div>'}
      <div style="min-width:0"><span class="label">${esc(ROTULO[d.tipo] || '')}${d.dano ? ` · ${d.dano} de dano` : ''}</span>
        <p style="margin-top:4px">${esc(q.texto)}</p>
        ${q.detalhes ? `<p class="muted" style="margin-top:6px;font-size:.8rem">${q.detalhes.map(esc).join('<br>')}</p>` : ''}
        <p class="muted num" style="margin-top:6px;font-size:.75rem">Passo ${i + 1} de ${r.quadros.length} · linha ${q.linha} do log</p></div></div>`;
  $('#rp-barra').value = i;
  document.querySelectorAll('#rp-log div').forEach(el => el.classList.toggle('atual', Number(el.dataset.i) === i));
  const atual = document.querySelector('#rp-log div.atual');
  if (atual) atual.scrollIntoView({ block: 'nearest' });
}
document.addEventListener('keydown', e => {
  if (aba() !== 'replay' || !S.rp || ['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement?.tagName)) return;
  if (e.key === 'ArrowRight') { S.rp.i = Math.min(S.rp.i + 1, S.rp.r.quadros.length - 1); desenharQuadro(); e.preventDefault(); }
  if (e.key === 'ArrowLeft') { S.rp.i = Math.max(S.rp.i - 1, 0); desenharQuadro(); e.preventDefault(); }
  if (e.key === ' ') { alternarPlay(); e.preventDefault(); }
});

async function renderRevisao() {
  const [lista, regs] = await Promise.all([api('/api/revisao'), api('/api/regras')]);
  const realce = m => esc(m).replace(/\{([JCN])\}/g, (_, k) => `<b title="${{ J: 'nome de jogador', C: 'nome de carta', N: 'número' }[k]}">{${k}}</b>`);
  main.innerHTML = `
    <header><h1>Linhas não lidas</h1><p class="sub">Frases do log que nenhuma regra reconhece, agrupadas por modelo: <b>{J}</b> é um jogador, <b>{C}</b> uma carta e <b>{N}</b> um número. Para cada uma, diga se ela pode ser ignorada (não muda nenhum resultado) ou crie uma regra para lê-la. Depois de salvar, todas as partidas são relidas.</p></header>
    ${lista.length ? lista.map((g, i) => `
      <section class="panel" data-i="${i}">
        <div class="row"><span class="tag-sug ${g.sugestao.acao}">${g.sugestao.acao === 'ignorar' ? 'Sugestão: ignorar' : 'Sugestão: criar regra'}</span>
          <span class="muted">${g.vezes} vez(es) em ${g.partidas.length} partida(s) · ${esc(g.sugestao.motivo)}</span></div>
        <div class="modelo">${realce(g.modelo)}</div>
        <details><summary class="muted" style="cursor:pointer">Exemplos</summary>
          <ul class="mono" style="margin:6px 0 0;padding-left:18px">${g.exemplos.map(x => `<li><a href="#partida-${x.partida}">#${x.partida}</a> linha ${x.linha}: ${esc(x.texto)}</li>`).join('')}</ul></details>
        <div class="row">
          <button class="${g.sugestao.acao === 'ignorar' ? 'primary' : ''}" data-ignorar="${i}">Ignorar: não impacta</button>
          <button class="${g.sugestao.acao === 'regra' ? 'primary' : ''}" data-regra="${i}">Criar regra de leitura…</button>
        </div>
        <div class="form-regra" hidden style="display:flex;flex-direction:column;gap:8px">
          <div class="row" style="flex-wrap:nowrap"><span class="label" style="width:130px;flex:none">Tipo de evento</span>
            <select class="r-tipo grow">${Object.entries(regs.tipos).filter(([k]) => k !== 'ignorar').map(([k, n]) => `<option value="${k}" ${k === 'outro' ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select></div>
          <div class="row" style="flex-wrap:nowrap"><span class="label" style="width:130px;flex:none">Expressão regular</span><input class="r-re grow mono" value="${esc(g.regex)}" spellcheck="false"></div>
          <p class="muted" style="font-size:.8rem">Montada a partir do modelo: o 1º jogador vira <span class="mono">player</span>, a 1ª carta <span class="mono">card</span>, a 2ª <span class="mono">target</span> e o 1º número <span class="mono">qtd</span>. Você pode editar.</p>
          <div class="teste r-teste">Testando…</div>
          <div class="row"><button class="primary r-salvar">Salvar regra e reler partidas</button></div>
        </div>
      </section>`).join('') : '<p class="vazio">Nenhuma linha não lida. Todas as frases dos seus logs são reconhecidas.</p>'}`;
  const testar = async (sec, g) => {
    const re = sec.querySelector('.r-re').value, tipo = sec.querySelector('.r-tipo').value;
    const regras = [{ id: 'teste', tipo, ativa: true, re }];
    const res = await Promise.all(g.exemplos.map(x => api('/api/regras/testar', { method: 'POST', body: JSON.stringify({ linha: x.texto, regras }) }).catch(e => ({ erro: e.message }))));
    sec.querySelector('.r-teste').textContent = res.map((r, k) => r.erro ? `✗ ${r.erro}` : r.length ? `✓ ${g.exemplos[k].texto}\n` + Object.entries(r[0].grupos).map(([a, b]) => `    ${a} = "${b}"`).join('\n') : `✗ não leu: ${g.exemplos[k].texto}`).join('\n\n');
  };
  const salvar = async (g, tipo, re) => {
    try {
      const r = await api('/api/revisao/regra', { method: 'POST', body: JSON.stringify({ tipo, re, id: tipo === 'ignorar' ? 'ign_usuario' : tipo + '_usuario', exemplos: g.exemplos.map(x => x.texto) }) });
      toast(`Regra "${r.id}" salva. ${r.relidas} partida(s) relida(s).`); renderRevisao(); atualizarStatus();
    } catch (e) { toast(e.message); }
  };
  document.querySelectorAll('[data-ignorar]').forEach(b => b.onclick = () => { const g = lista[b.dataset.ignorar]; salvar(g, 'ignorar', g.regex.replace(/\(\?P<[a-z]+>/g, '(?:')); });
  document.querySelectorAll('[data-regra]').forEach(b => b.onclick = () => {
    const sec = b.closest('section'), g = lista[b.dataset.regra], form = sec.querySelector('.form-regra');
    form.hidden = !form.hidden;
    if (!form.hidden) {
      testar(sec, g);
      sec.querySelector('.r-re').oninput = () => testar(sec, g);
      sec.querySelector('.r-tipo').onchange = () => testar(sec, g);
      sec.querySelector('.r-salvar').onclick = () => salvar(g, sec.querySelector('.r-tipo').value, sec.querySelector('.r-re').value);
    }
  });
}

// ---- corrigir os ícones de um deck (a correção vale para o arquétipo inteiro daqui em diante)
async function editarIcones(d, aoSalvar) {
  const det = d.cartas ? d : await api('/api/decks/' + d.id);
  const pokes = [...new Set(det.cartas.filter(c => c.secao === 'Pokémon').map(c => pokeId(c.nome)))];
  let atuais = [...(d.icones || [])].slice(0, 2);
  const fundo = document.createElement('div');
  fundo.className = 'janela-fundo';
  fundo.innerHTML = `<div class="janela" role="dialog" aria-label="Corrigir ícones">
    <h2 style="margin-top:0">Ícones de “${esc(d.nome)}”</h2>
    <p class="muted" style="font-size:.85rem">Escolha até 2 Pokémon. A correção fica guardada e passa a valer para todo deck ${esc(d.nome_arquetipo || '')} (novas listas, matchups e meta).</p>
    <div class="previa" id="ic-previa"></div>
    <div class="row"><input id="ic-1" placeholder="1º Pokémon (ex.: Dragapult)" style="flex:1"><input id="ic-2" placeholder="2º Pokémon (opcional)" style="flex:1"></div>
    <span class="label">Pokémon da lista (clique para usar)</span>
    <div class="chips-poke">${pokes.map(p => `<button data-poke="${esc(p)}"><img src="/icone/${encodeURIComponent(p)}" alt="">${esc(p)}</button>`).join('')}</div>
    <div class="row"><button id="ic-sugestao" title="Apaga a correção e volta à sugestão automática">Voltar à sugestão</button><span class="grow"></span><button id="ic-cancelar">Cancelar</button><button class="primary" id="ic-salvar">Salvar</button></div>
  </div>`;
  document.body.appendChild(fundo);
  const i1 = fundo.querySelector('#ic-1'), i2 = fundo.querySelector('#ic-2');
  i1.value = atuais[0] || ''; i2.value = atuais[1] || '';
  const previa = () => { const v = [i1.value, i2.value].map(x => pokeId(x)).filter(Boolean);
    fundo.querySelector('#ic-previa').innerHTML = v.map(p => `<img src="/icone/${encodeURIComponent(p)}" alt="${esc(p)}" title="${esc(p)}">`).join('') || '<span class="muted">sem ícone</span>'; };
  i1.oninput = i2.oninput = previa; previa();
  fundo.querySelectorAll('[data-poke]').forEach(b => b.onclick = () => {
    if (!i1.value || (i2.value && document.activeElement !== i2)) { i1.value = b.dataset.poke; } else { i2.value = b.dataset.poke; }
    if (i1.value === i2.value) i2.value = ''; previa(); });
  const fechar = () => fundo.remove();
  const salvar = async lista => {
    try { await api('/api/decks/' + d.id, { method: 'PUT', body: JSON.stringify({ icones: lista }) }); }
    catch (e) { toast(e.message); return; }
    fechar(); await carregarArquetipos(); toast(lista.length ? 'Ícones corrigidos — vou usar nos próximos decks deste tipo' : 'Voltou à sugestão automática'); aoSalvar && aoSalvar();
  };
  fundo.onclick = e => { if (e.target === fundo) fechar(); };
  fundo.querySelector('#ic-cancelar').onclick = fechar;
  fundo.querySelector('#ic-sugestao').onclick = () => salvar([]);
  fundo.querySelector('#ic-salvar').onclick = () => salvar([i1.value, i2.value].map(x => x.trim()).filter(Boolean));
  i1.focus();
}

/* ---- DECISÕES: o que anda junto com vencer nas suas partidas (só a partir dos logs) */
async function renderDecisoes() {
  const f = S.filtroDec || (S.filtroDec = { de: '', ate: '', deck: '', lista: '', adv: '', periodo: 0, min: 3, ordem: '' });
  if (f.periodo) { const d0 = new Date(Date.now() - (f.periodo - 1) * 864e5); f.de = d0.toISOString().slice(0, 10); f.ate = ''; }
  const qs = new URLSearchParams(Object.entries({ de: f.de, ate: f.ate, deck: f.deck, lista: f.lista, adv: f.adv, min: f.min, ordem: f.ordem || '' }).filter(([, v]) => v !== '' && v != null)).toString();
  await carregarJogadores();
  const [r, todos, listas] = await Promise.all([api(comJog('/api/decisoes?' + qs)), api(comJog('/api/partidas')), api('/api/decks')]);
  const decks = [...new Set(todos.partidas.map(l => l.meu_deck).filter(Boolean))].sort();
  const advs = [...new Set(todos.partidas.map(l => l.deck_adv).filter(Boolean))].sort();
  const dif = x => x == null ? '<span class="muted">–</span>' : `<b style="color:${x > 0 ? 'var(--good)' : x < 0 ? 'var(--bad)' : 'var(--muted)'}">${x > 0 ? '+' : ''}${fmt(x, 0)} p.p.</b>`;
  const tabelaCartas = (lista, vazio) => {
    const l = lista.filter(c => c.n >= f.min && c.sem_n > 0);
    if (!l.length) return `<p class="muted">${vazio}</p>`;
    return `<div class="tabela"><table><thead><tr><th>Carta</th><th class="n">Partidas</th><th class="n">V–D</th><th>Vitória quando jogou</th><th>Quando não jogou</th><th>Diferença</th></tr></thead><tbody>
      ${l.map(c => `<tr><td><span class="cel-carta">${mini(c.carta)}${esc(c.carta)}</span></td><td class="n">${c.n}</td><td class="n">${c.v}–${c.d}</td><td>${taxaHtml(c)}</td>
        <td>${pct(c.taxa_sem)} <span class="ic">${c.sem_n} partidas</span></td><td>${dif(c.diferenca)}</td></tr>`).join('')}</tbody></table></div>`;
  };
  // versão compacta para as duas colunas (começando × indo em segundo)
  const tabelaCompacta = (lista, vazio) => {
    const l = lista.filter(c => c.n >= f.min && c.sem_n > 0);
    if (!l.length) return `<p class="muted" style="font-size:.85rem">${vazio}</p>`;
    return `<div class="tabela"><table><thead><tr><th>Carta</th><th class="n">Partidas</th><th>Vitória quando jogou</th><th>Diferença</th></tr></thead><tbody>
      ${l.map(c => `<tr><td><span class="cel-carta">${mini(c.carta)}${esc(c.carta)}</span></td><td class="n">${c.n}</td><td>${taxaHtml(c)}</td><td title="sem ela: ${pct(c.taxa_sem)} em ${c.sem_n} partidas">${dif(c.diferenca)}</td></tr>`).join('')}</tbody></table></div>`;
  };
  const po = r.por_ordem || {};
  const ROT_ORDEM = { primeiro: 'Começando', segundo: 'Indo em segundo' };
  const colunaOrdem = k => { const o = po[k] || { partidas: 0, aberturas: [], ritmo: {} };
    return `<div class="panel" style="padding:12px;gap:8px;background:var(--sunken)">
      <div class="ordem-cab"><h3>${ROT_ORDEM[k]}</h3><span class="muted" style="font-size:.85rem">${o.partidas} partida${o.partidas === 1 ? '' : 's'}${o.partidas ? ` · vitória ${pct(o.taxa)}` : ''}</span></div>
      ${o.partidas ? `<p class="muted" style="font-size:.8rem">Seu turno do 1º prêmio, vitórias × derrotas: <b>${fmt(o.ritmo.V?.premio)} × ${fmt(o.ritmo.D?.premio)}</b> · 1º ataque: ${fmt(o.ritmo.V?.ataque)} × ${fmt(o.ritmo.D?.ataque)}</p>` : ''}
      ${tabelaCompacta(o.aberturas, `Nenhuma carta de abertura com pelo menos ${f.min} partidas ${ROT_ORDEM[k].toLowerCase()} (e alguma partida sem ela).`)}</div>`; };
  const vi = r.viradas, rv = r.ritmo, pc = r.perdeu_controle;
  const maxPc = Math.max(1, ...pc.map(x => x.derrotas));
  main.innerHTML = `
    ${trilha()}<header><h1>Decisões</h1><p class="sub">${S.jogador ? `Mostrando: <b>${esc(nomeJogadorSel())}</b> (cada partida do ponto de vista de quem jogou). ` : ''}O que, nas suas partidas, anda junto com vencer ou perder: jogadas de abertura, corrida de prêmios, o turno em que o jogo escapou e o seu ritmo. Tudo vem dos logs.</p></header>
    <div class="aviso">São <b>correlações</b>, não causas: uma carta pode aparecer mais nas vitórias porque você só consegue jogá-la quando a partida já está boa. Use como pista para revisar replays. Com poucas partidas, a faixa provável (passe o mouse na taxa) é larga.</div>
    <div class="row">
      <div class="chips-periodo">${PERIODOS.map(([v, rt]) => `<button data-periodo="${v}" aria-pressed="${f.periodo === v && !(v === 0 && (f.de || f.ate))}">${rt}</button>`).join('')}</div>
      <div class="chips-periodo" role="group" aria-label="Quem começou">${[['', 'Todas'], ['primeiro', 'Começando'], ['segundo', 'Indo em segundo']].map(([v, rt]) => `<button data-ordem="${v}" aria-pressed="${(f.ordem || '') === v}">${rt}</button>`).join('')}</div>
      <label class="label" for="x-de">De</label><input type="date" id="x-de" value="${f.de}">
      <label class="label" for="x-ate">Até</label><input type="date" id="x-ate" value="${f.ate}">
      <span class="grow"></span>
      ${seletorJogador()}
      <select id="x-deck"><option value="">Todos os seus decks</option>${decks.map(x => `<option value="${esc(x)}" ${f.deck === x ? 'selected' : ''}>${esc(nomeDeck(x))}</option>`).join('')}</select>
      <select id="x-lista"><option value="">Todas as listas</option>${listas.map(x => `<option value="${x.id}" ${String(f.lista) === String(x.id) ? 'selected' : ''}>${esc(x.nome)}</option>`).join('')}</select>
      <select id="x-adv"><option value="">Todos os adversários</option>${advs.map(x => `<option value="${esc(x)}" ${f.adv === x ? 'selected' : ''}>${esc(nomeDeck(x))}</option>`).join('')}</select>
      <label class="label" for="x-min">Mín. partidas</label><input type="number" id="x-min" min="1" max="50" value="${f.min}" style="width:64px">
    </div>
    ${!r.partidas ? '<p class="muted">Nenhuma partida com resultado nesse filtro.</p>' : `
    <div class="kpis">
      <div class="kpi"><span class="label">Partidas analisadas</span><span class="v">${r.partidas}</span><span class="d">${r.vitorias} vitórias</span></div>
      <div class="kpi"><span class="label">Viradas</span><span class="v">${pct(vi.taxa_virada)}</span><span class="d">venceu ${vi.perdendo_e_venceu} de ${vi.perdendo} em que ficou atrás nos prêmios</span></div>
      <div class="kpi"><span class="label">Vantagem entregue</span><span class="v">${pct(vi.taxa_entregou)}</span><span class="d">perdeu ${vi.ganhando_e_perdeu} de ${vi.ganhando} em que esteve à frente</span></div>
      <div class="kpi"><span class="label">Ritmo (vitórias × derrotas)</span><span class="v">${fmt(rv.V?.premio)} × ${fmt(rv.D?.premio)}</span><span class="d">seu turno médio do 1º prêmio · 1º ataque: ${fmt(rv.V?.ataque)} × ${fmt(rv.D?.ataque)}</span></div>
    </div>
    <div class="grid2">
      <section class="panel"><h2>Peso do primeiro prêmio</h2>${tabelaGrupos(r.primeiro_premio, 'Quem pegou primeiro')}</section>
      <section class="panel"><h2>Turno em que você perdeu o controle</h2>
        <p class="muted" style="font-size:.85rem">Nas derrotas: o seu turno a partir do qual o adversário ficou à frente nos prêmios e não foi mais alcançado.</p>
        ${pc.length ? pc.map(x => `<div class="row" style="gap:8px;margin:4px 0"><span style="width:70px">${x.turno}º turno</span><div style="flex:1;background:rgba(127,127,127,.15);border-radius:4px;height:14px"><div style="width:${100 * x.derrotas / maxPc}%;background:var(--bad);height:100%;border-radius:4px"></div></div><span class="n" style="width:80px;text-align:right">${x.derrotas} derrota${x.derrotas === 1 ? '' : 's'}</span></div>`).join('') : '<p class="muted">Sem derrotas com placar de prêmios nesse filtro.</p>'}
      </section>
    </div>
    <section class="panel"><h2>${f.ordem ? `Aberturas ${ROT_ORDEM[f.ordem].toLowerCase()}` : 'Aberturas por quem começou'} <span class="muted" style="font-weight:400;font-size:.85rem">(seus 2 primeiros turnos)</span></h2>
      <p class="muted" style="font-size:.85rem">Cartas que você jogou, ligou ou evoluiu nos seus dois primeiros turnos. Regra do Standard: quem começa não ataca nem joga Apoiador no 1º turno, e ninguém evolui no próprio 1º turno. Por isso a abertura de quem começa é outro jogo, e cada lado só compara partidas com a mesma ordem. Diferença = taxa quando jogou − taxa quando não jogou.</p>
      ${f.ordem ? tabelaCartas(r.aberturas, `Nenhuma carta de abertura com pelo menos ${f.min} partidas (e alguma partida sem ela).`)
        : `<div class="grid2">${colunaOrdem('primeiro')}${colunaOrdem('segundo')}</div>`}
      ${r.sem_ordem && !f.ordem ? `<p class="muted" style="font-size:.8rem">${r.sem_ordem} partida(s) sem a informação de quem começou ficaram fora da separação.</p>` : ''}</section>
    <section class="panel"><h2>Cartas jogadas em qualquer momento</h2>
      ${tabelaCartas(r.cartas_jogadas, `Nenhuma carta com pelo menos ${f.min} partidas (e alguma partida sem ela).`)}</section>`}`;
  const re = () => renderDecisoes();
  ligarSeletorJogador(re);
  $('#x-deck').onchange = e => { f.deck = e.target.value; re(); };
  $('#x-lista').onchange = e => { f.lista = e.target.value; re(); };
  $('#x-adv').onchange = e => { f.adv = e.target.value; re(); };
  $('#x-min').onchange = e => { f.min = Math.max(1, Number(e.target.value) || 1); re(); };
  $('#x-de').onchange = e => { f.de = e.target.value; f.periodo = 0; re(); };
  $('#x-ate').onchange = e => { f.ate = e.target.value; f.periodo = 0; re(); };
  document.querySelectorAll('[data-periodo]').forEach(b => b.onclick = () => { f.periodo = Number(b.dataset.periodo); if (!f.periodo) { f.de = ''; f.ate = ''; } re(); });
  document.querySelectorAll('[data-ordem]').forEach(b => b.onclick = () => { f.ordem = b.dataset.ordem; re(); });
}
