<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Coletor de Partidas TCG Live</title>
<link rel="icon" href="/icone.ico">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">

<body>
<div class="app">
  <nav>

    <a href="#partidas" data-secao="partidas" class="secao">Minhas partidas</a>
    <a href="#decks" data-secao="decks" class="secao">Meus decks</a>
    <a href="#meta" data-secao="meta" class="secao">Meta e torneios</a>

        Programa<span class="seta">›</span></summary>
      <a href="#regras-standard">Regras do Standard</a>
      <a href="#ajustes">Ajustes e captura</a>
      <a href="#amigos">Amigos (trocar logs)</a>
      <a href="#biblioteca">Biblioteca de cartas</a>
      <a href="#revisao">Linhas não lidas<span class="badge" id="badge-revisao" hidden></span></a>
      <a href="#regras">Regras de leitura</a>
    </details>
    <div class="estado" id="estado"></div>
  </nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast" hidden></div>
